<!-- ✅ PRESENSI TJKT FINAL 2025 — Versi Profesional UI (Tabel Berwarna & Tombol Admin) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>

<style>
  /* === Variabel Warna & Tema Profesional === */
  :root {
    --bg: #f8fafc;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --info: #0ea5e9;
    --info-hover: #0284c7;
    --success: #16a34a;
    --success-hover: #15803d;
    --danger: #dc2626;
    --warning: #f59e0b;
    --dark: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --card-shadow:
      0 4px 10px -1px rgba(245, 158, 11, 0.1),
      0 2px 4px -1px rgba(0, 0, 0, 0.03);
    --card-shadow-hover:
      0 20px 25px -5px rgba(245, 158, 11, 0.2),
      0 10px 10px -5px rgba(245, 158, 11, 0.06);
  }

  body {
    margin: 0;
    background: var(--bg);
    font-family: "Inter", Arial, sans-serif;
    color: var(--dark);
    line-height: 1.5;
  }

  .presensi-root {
    padding: 40px 20px 60px;
  }

  .presensi-root h2 {
    margin: 0 0 40px;
    color: var(--dark);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    text-align: center;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  /* === Badge Judul Penting === */
  .badge-title {
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 30px;
    box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border: 2px solid #fff;
  }

  .presensi-grid {
    display: grid !important;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
    min-height: 200px;
  }

  /* === Kartu Kelas === */
  .kelas-card {
    background: linear-gradient(135deg, #ffffff 0%, #fffdf0 50%, #fef08a 100%);
    border-radius: 16px;
    padding: 30px 24px;
    box-shadow: var(--card-shadow);
    text-align: center;
    position: relative;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid #fde047;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .kelas-card::before {
    content: "📚";
    font-size: 42px;
    display: block;
    margin-bottom: 12px;
    filter: drop-shadow(0 4px 6px rgba(245, 158, 11, 0.2));
  }

  .kelas-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--card-shadow-hover);
    border-color: #facc15;
  }

  .kelas-card h3 {
    margin: 0 0 20px;
    font-size: 20px;
    color: var(--dark);
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .kelas-card.tingkat-x {
    border-top: 5px solid #3b82f6;
  }
  .kelas-card.tingkat-xi {
    border-top: 5px solid #10b981;
  }
  .kelas-card.tingkat-xii {
    border-top: 5px solid #f59e0b;
  }

  /* === Tombol === */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: calc(100% - 12px);
    margin: 6px;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .btn-isi {
    background: var(--primary);
    color: #fff;
  }
  .btn-isi:hover {
    background: var(--primary-hover);
    transform: scale(1.02);
  }
  .btn-isi:active {
    transform: scale(0.98);
  }

  .btn-rekap {
    background: var(--info);
    color: #fff;
  }
  .btn-rekap:hover {
    background: var(--info-hover);
    transform: scale(1.02);
  }
  .btn-rekap:active {
    transform: scale(0.98);
  }

  /* Tombol Walas (Di sebelah dropdown) */
  .btn-walas {
    font-size: 13px;
    font-weight: 700;
    background: var(--success);
    color: #fff;
    border: none;
    padding: 0 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    height: 41px; /* Menyesuaikan dengan perkiraan tinggi select */
    white-space: nowrap; /* Mencegah teks turun ke bawah */
    box-shadow: 0 2px 6px rgba(22, 163, 74, 0.25);
    flex-shrink: 0;
  }

  .btn-walas:hover {
    background: var(--success-hover);
    transform: scale(1.02);
  }
  .btn-walas:active {
    transform: scale(0.98);
  }

  /* Tombol Panel Admin (sekarang di dalam kartu, gaya konsisten .btn) */
  .btn-superadmin {
    background: var(--success);
    color: #fff;
  }
  .btn-superadmin:hover {
    background: var(--success-hover);
    transform: scale(1.02);
  }
  .btn-superadmin:active {
    transform: scale(0.98);
  }

  /* === Form Element === */
  .input,
  select,
  textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 12px;
    font-family: inherit;
    color: var(--dark);
    background-color: #fff;
    transition: all 0.2s;
    box-sizing: border-box;
  }

  .input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  /* Warna Pilihan Presensi */
  .select-presensi {
    font-weight: 600;
    transition:
      background-color 0.3s,
      color 0.3s;
  }
  .select-presensi.hadir {
    background-color: #dcfce7 !important;
    color: #15803d !important;
    border-color: #bbf7d0;
  }
  .select-presensi.sakit {
    background-color: #fef3c7 !important;
    color: #b45309 !important;
    border-color: #fde68a;
  }
  .select-presensi.izin {
    background-color: #e0f2fe !important;
    color: #0369a1 !important;
    border-color: #bae6fd;
  }
  .select-presensi.alfa {
    background-color: #ffedd5 !important;
    color: #c2410c !important;
    border-color: #fed7aa;
  }
  .select-presensi.cabut {
    background-color: #fee2e2 !important;
    color: #b91c1c !important;
    border-color: #fecaca;
  }

  .opt-hadir {
    background-color: #dcfce7;
    color: #15803d;
    font-weight: bold;
  }
  .opt-sakit {
    background-color: #fef3c7;
    color: #b45309;
    font-weight: bold;
  }
  .opt-izin {
    background-color: #e0f2fe;
    color: #0369a1;
    font-weight: bold;
  }
  .opt-alfa {
    background-color: #ffedd5;
    color: #c2410c;
    font-weight: bold;
  }
  .opt-cabut {
    background-color: #fee2e2;
    color: #b91c1c;
    font-weight: bold;
  }

  /* === Popup Overlay === */
  .popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 24px;
    backdrop-filter: blur(5px);
  }
  .popup-overlay[style*="flex"] {
    pointer-events: auto;
  }
  .popup-overlay:not([style*="flex"]) {
    pointer-events: none;
  }

  .popup {
    background: #fff;
    border-radius: 20px;
    width: 100%;
    max-width: 900px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    padding: 32px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    animation: popupFade 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes popupFade {
    from {
      opacity: 0;
      transform: translateY(10px) scale(0.98);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .close {
    position: absolute;
    right: 20px;
    top: 20px;
    background: #f1f5f9;
    color: var(--text-muted);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: bold;
    font-size: 16px;
  }
  .close:hover {
    background: #e2e8f0;
    color: var(--danger);
    transform: rotate(90deg);
  }

  /* === Tombol Aksi di Popup === */
  .action-btn,
  .action-save,
  .action-edit,
  .action-del {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
    font-family: inherit;
    margin-right: 6px;
  }
  .action-save {
    background: var(--success);
    color: #fff;
  }
  .action-edit {
    background: var(--warning);
    color: #fff;
  }
  .action-del {
    background: var(--danger);
    color: #fff;
  }

  .action-save:hover,
  .action-edit:hover,
  .action-del:hover {
    filter: brightness(1.1);
    transform: translateY(-2px);
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }
  .action-save:active,
  .action-edit:active,
  .action-del:active {
    transform: translateY(0);
  }

  /* === Tabel (Desain Clean dengan Sentuhan Warna Elegan) === */
  .table-freeze-wrapper {
    max-height: 65vh;
    overflow: auto;
    position: relative;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.02);
  }

  .table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 14px;
  }
  .table th,
  .table td {
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  .table th:last-child,
  .table td:last-child {
    border-right: none;
  }

  /* Header Tabel Warna Emas/Kuning Halus */
  .table th {
    background: linear-gradient(135deg, #fffbeb, #fef3c7);
    font-weight: 600;
    color: #92400e;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.5px;
    border-bottom: 2px solid #fde68a;
  }
  .table tr:last-child td {
    border-bottom: none;
  }
  /* Zebra cross table (selang-seling warna) */
  .table tbody tr:nth-child(even) td {
    background: #fffdf0;
  }
  .table tbody tr:hover td {
    background: #fef9c3;
  }

  /* Freeze Header & Kolom Kiri */
  .table-freeze-wrapper thead th {
    position: sticky;
    top: 0;
    background: #fffbeb;
    z-index: 3;
    box-shadow: 0 2px 0 #fde68a;
  }
  .table-freeze-wrapper th:first-child,
  .table-freeze-wrapper td:first-child {
    position: sticky;
    left: 0;
    background: #fff;
    z-index: 2;
    box-shadow: 2px 0 0 var(--border);
  }
  /* Efek Hover dan Zebra di Kolom Kiri (Freeze) */
  .table-freeze-wrapper tr:nth-child(even) td:first-child {
    background: #fffdf0;
  }
  .table-freeze-wrapper tr:hover td:first-child {
    background: #fef9c3;
  }
  .table-freeze-wrapper thead th:first-child {
    z-index: 4;
    background: #fffbeb;
    box-shadow: 2px 2px 0 #fde68a;
  }

  /* Scrollbar Elegan untuk Tabel & Popup */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: #f1f5f9;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  /* === Details & Summary === */
  details {
    background: #f8fafc;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  details summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--dark);
    list-style: none;
    display: flex;
    align-items: center;
  }
  details summary::before {
    content: "▸";
    margin-right: 8px;
    transition: transform 0.2s;
  }
  details[open] summary::before {
    transform: rotate(90deg);
  }
  details p {
    margin: 12px 0 0;
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* === DATA MENTAH FULL HEIGHT === */
  .raw-full {
    max-height: calc(100vh - 180px);
    overflow-y: auto;
  }

  /* === WARNA PERSENTASE KEHADIRAN (Lebih Halus) === */
  .persen-merah {
    background: #fee2e2 !important;
    color: #b91c1c !important;
    font-weight: 700;
    text-align: center;
  }
  .persen-kuning {
    background: #fef3c7 !important;
    color: #b45309 !important;
    font-weight: 700;
    text-align: center;
  }
  .persen-hijau {
    background: #dcfce7 !important;
    color: #15803d !important;
    font-weight: 700;
    text-align: center;
  }

  /* =========================================
   === RESPONSIVE PADAT (COMPACT) MOBILE ===
   ========================================= */
  @media (max-width: 720px) {
    .presensi-root {
      padding: 16px 12px 30px;
    }
    .presensi-root h2 {
      font-size: 20px;
      margin-bottom: 24px;
      gap: 6px;
    }
    .presensi-grid {
      gap: 12px;
      grid-template-columns: 1fr;
    }

    .kelas-card {
      padding: 20px 16px;
      min-height: 140px;
    }
    .kelas-card::before {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .kelas-card h3 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      margin: 4px 0;
      padding: 10px;
      font-size: 13px;
      border-radius: 8px;
    }
    .input,
    select,
    textarea {
      padding: 8px 12px;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .popup-overlay {
      padding: 12px;
    }
    .popup {
      max-width: 100%;
      padding: 20px 16px;
      border-radius: 12px;
    }
    .close {
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      font-size: 14px;
    }

    .table th,
    .table td {
      padding: 8px 10px;
      font-size: 12px;
    }
    .table th {
      font-size: 11px;
    }

    .action-save,
    .action-edit,
    .action-del {
      padding: 8px 12px;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .badge-title {
      font-size: 11px;
      padding: 4px 12px;
    }
  }

  /* === Top Progress Bar (Visual Indicator Seluruh Proses) === */
  .top-progress-bar {
    position: fixed;
    top: 0;
    left: 0;
    height: 4px;
    width: 0%;
    background: linear-gradient(90deg, #2563eb, #0ea5e9, #10b981);
    z-index: 99999;
    transition:
      width 0.2s ease,
      opacity 0.4s ease;
    box-shadow: 0 0 12px rgba(37, 99, 235, 0.7);
    opacity: 0;
    pointer-events: none;
  }
  .top-progress-bar.active {
    opacity: 1;
  }

  /* === Mode Persentase Bar & Loading Modern === */
  .global-loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.65);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999999;
    padding: 20px;
    opacity: 0;
    transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .global-loading-overlay.active {
    display: flex !important;
    opacity: 1 !important;
  }
  .loading-box {
    text-align: center;
    padding: 30px 16px;
  }
  .progress-card {
    background: #ffffff;
    border-radius: 18px;
    padding: 28px 24px;
    max-width: 440px;
    margin: 0 auto;
    text-align: center;
    box-shadow: 0 12px 28px -6px rgba(0, 0, 0, 0.08);
    border: 1px solid var(--border);
  }
  .progress-ring-container {
    position: relative;
    width: 84px;
    height: 84px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .progress-spinner {
    position: absolute;
    inset: 0;
    border: 4px solid #e2e8f0;
    border-top: 4px solid var(--primary);
    border-right: 4px solid var(--info);
    border-radius: 50%;
    animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
  }
  .progress-percent-text {
    font-size: 18px;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: -0.5px;
    font-variant-numeric: tabular-nums;
  }
  .progress-main-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 6px;
  }
  .progress-bar-track {
    width: 100%;
    height: 10px;
    background: #f1f5f9;
    border-radius: 20px;
    overflow: hidden;
    margin: 14px 0 10px;
    border: 1px solid #e2e8f0;
    position: relative;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #3b82f6, #06b6d4, #10b981);
    border-radius: 20px;
    transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .progress-status-desc {
    font-size: 13px;
    color: var(--text-muted);
    min-height: 20px;
  }

  /* === Navigasi Floating Window Admin (Back & Close All) === */
  .btn-modal-back {
    position: absolute;
    left: 20px;
    top: 20px;
    background: #f1f5f9;
    color: var(--dark);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    display: none;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.2s;
    z-index: 10;
  }
  .btn-modal-back:hover {
    background: #e2e8f0;
    color: var(--primary);
    transform: translateX(-2px);
  }
  .btn-modal-close-all {
    position: absolute;
    right: 64px;
    top: 20px;
    background: #fee2e2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    border-radius: 18px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    display: none;
    align-items: center;
    cursor: pointer;
    transition: all 0.2s;
    z-index: 10;
  }
  .btn-modal-close-all:hover {
    background: #fecaca;
    color: #991b1b;
  }
  .speed-mode-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    background: #ecfdf5;
    color: #047857;
    border: 1px solid #a7f3d0;
    padding: 3px 10px;
    border-radius: 20px;
    margin-top: 8px;
  }

  /* === Tampilan Padat & Berisi untuk Dashboard Walas === */
  .walas-dashboard-container {
    animation: popupFade 0.25s ease-out;
  }
  .input-compact {
    padding: 6px 10px !important;
    font-size: 13px !important;
    height: 34px !important;
    border-radius: 7px !important;
  }
  .btn-compact {
    padding: 6px 12px !important;
    font-size: 12px !important;
    height: 34px !important;
    border-radius: 7px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    cursor: pointer !important;
  }
  .table-compact th {
    padding: 7px 10px !important;
    font-size: 12px !important;
    white-space: nowrap !important;
    background: #f1f5f9 !important;
    position: sticky !important;
    top: 0 !important;
    z-index: 2 !important;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
  }
  .table-compact td {
    padding: 4px 6px !important;
    font-size: 12px !important;
    vertical-align: middle !important;
  }
  .table-compact .cellEdit,
  .table-compact .cellEditBaru {
    padding: 4px 8px !important;
    font-size: 12px !important;
    height: 30px !important;
    margin: 0 !important;
    border-radius: 6px !important;
    font-weight: 600 !important;
    min-width: 90px !important;
  }
  .table-compact-wrapper {
    max-height: 52vh;
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
  }

  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
</style>

<!-- Top Progress Bar -->

  /* === 1. CLIENT DATA CACHE & PERFORMANCE ACCELERATOR === */
  const sheetDataCache = {
    all: {}, // sheetName -> { data, timestamp }
    headers: {}, // sheetName -> { data, timestamp }
  };
  const CACHE_TTL_MS = 90 * 1000; // 90 detik cache client

  function invalidateSheetCache(sheet) {
    if (sheet) {
      delete sheetDataCache.all[sheet];
      delete sheetDataCache.headers[sheet];
    } else {
      sheetDataCache.all = {};
      sheetDataCache.headers = {};
    }
  }

  async function fetchJsonWithTimeout(url, options = {}, timeoutMs = 14000) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(url, {
        ...options,
        signal: controller.signal,
      });
      clearTimeout(id);
      return response;
    } catch (err) {
      clearTimeout(id);
      // Ubah error AbortController yang mentah & membingungkan ("signal is
      // aborted without reason") menjadi pesan yang bisa dipahami user, dan
      // bedakan dari error jaringan biasa (mis. HP offline / DNS gagal).
      if (err && err.name === "AbortError") {
        const timeoutErr = new Error(
          `Server tidak merespon dalam ${Math.round(timeoutMs / 1000)} detik. Kemungkinan Apps Script sedang sibuk (banyak siswa mengisi presensi bersamaan) atau koneksi lambat.`,
        );
        timeoutErr.isTimeout = true;
        throw timeoutErr;
      }
      const netErr = new Error(
        "Tidak dapat terhubung ke server. Periksa koneksi internet Anda.",
      );
      netErr.isNetworkError = true;
      throw netErr;
    }
  }

  async function getSheetData(sheet, action = "headers", forceRefresh = false) {
    const isAll = action === "all";
    const store = isAll ? sheetDataCache.all : sheetDataCache.headers;
    const now = Date.now();

    // 1. Cek cache lokal jika masih segar dan tidak force refresh
    if (
      !forceRefresh &&
      store[sheet] &&
      now - store[sheet].timestamp < CACHE_TTL_MS
    ) {
      return store[sheet].data;
    }

    // 2. Jika minta 'headers' tapi 'all' sudah ada dan masih segar di cache, ekstraksi langsung (0ms)
    if (
      !forceRefresh &&
      !isAll &&
      sheetDataCache.all[sheet] &&
      now - sheetDataCache.all[sheet].timestamp < CACHE_TTL_MS
    ) {
      const allData = sheetDataCache.all[sheet].data;
      const values = allData.values || [];
      if (values.length > 0) {
        const headers = values[0].slice(2);
        const classPassword = values[1] ? values[1][1] || "" : "";
        return {
          headers,
          classPassword,
          namaGuru: allData.namaGuru || "",
        };
      }
    }

    // 3. Request ke Apps Script dengan timeout aman dan URI encode
    const encodedSheet = encodeURIComponent(sheet);
    const url = isAll
      ? `${SCRIPT_URL}?sheet=${encodedSheet}&action=all&_t=${now}`
      : `${SCRIPT_URL}?sheet=${encodedSheet}&_t=${now}`;
    // Data "all" (seluruh sheet) lebih berat drpd "headers", jadi dikasih
    // jatah waktu lebih longgar supaya tidak keburu di-abort saat server
    // lagi rame (banyak siswa submit presensi bersamaan).
    const timeoutMs = isAll ? 20000 : 14000;

    try {
      const res = await fetchJsonWithTimeout(url, {}, timeoutMs);
      const data = await res.json();

      // Simpan ke cache
      store[sheet] = {
        data,
        timestamp: now,
      };

      return data;
    } catch (fetchErr) {
      console.warn("getSheetData fetch error:", fetchErr);
      // Jika fetch gagal tapi ada cache lama, gunakan cache lama daripada freeze
      if (store[sheet] && store[sheet].data) {
        return store[sheet].data;
      }
      throw fetchErr;
    }
  }

  // Pre-fetch data di latar belakang saat dropdown kelas dipilih

  /* === 2. CONTROLLER PROGRESS BAR DENGAN PERSENTASE & WATCHDOG ANTI-STUK === */
  let activeProgressTimer = null;
  let loadingSafetyTimeout = null;

  function updateProgressBar(percent, title, subtitle) {
    const percentEl = document.getElementById("progressPercent");
    const barEl = document.getElementById("progressBarFill");
    const titleEl = document.getElementById("progressTitle");
    const subEl = document.getElementById("progressSubtitle");
    const topBar = document.getElementById("topProgressBar");

    const p = Math.min(100, Math.max(0, Math.round(percent)));
    if (percentEl) percentEl.textContent = `${p}%`;
    if (barEl) barEl.style.width = `${p}%`;
    if (title && titleEl) titleEl.textContent = title;
    if (subtitle && subEl) subEl.textContent = subtitle;

    if (topBar) {
      topBar.classList.add("active");
      topBar.style.width = `${p}%`;
    }
  }

  function showLoading(
    text = "Memuat data...",
    subtitle = "Menghubungkan ke server...",
  ) {
    if (activeProgressTimer) {
      clearInterval(activeProgressTimer);
      activeProgressTimer = null;
    }
    if (loadingSafetyTimeout) {
      clearTimeout(loadingSafetyTimeout);
      loadingSafetyTimeout = null;
    }

    const overlay = document.getElementById("globalLoadingOverlay");
    if (overlay) overlay.classList.add("active");

    const topBar = document.getElementById("topProgressBar");
    if (topBar) {
      topBar.classList.add("active");
      topBar.style.width = "15%";
    }

    updateProgressBar(15, text, subtitle);

    let currentP = 15;
    activeProgressTimer = setInterval(() => {
      if (currentP < 88) {
        const inc = currentP < 40 ? 7 : currentP < 70 ? 3.5 : 1.2;
        currentP += inc;
        let sub = subtitle;
        if (currentP > 60) sub = "Membaca baris dan memproses struktur data...";
        else if (currentP > 30) sub = "Mengambil data spreadsheet Google...";
        updateProgressBar(currentP, text, sub);
      }
    }, 90);

    // Watchdog safety timeout (35s): Otomatis pulihkan UI HANYA jika benar-
    // benar macet total. Sebelumnya 15 detik — terlalu pendek dibanding
    // proses verifikasi Login Walas + pengambilan data dashboard yang
    // wajar bisa memakan waktu s/d ~28-34 detik saat Apps Script sedang
    // sibuk (mis. banyak siswa mengisi presensi bersamaan). Watchdog yang
    // terlalu pendek membuat loading "hilang" duluan padahal prosesnya
    // masih berjalan di belakang layar — itulah yang terlihat seperti macet.
    loadingSafetyTimeout = setTimeout(() => {
      console.warn("showLoading watchdog timeout (35s) dipicu. Memulihkan UI.");
      hideLoading();
    }, 35000);
  }

  function hideLoading() {
    if (activeProgressTimer) {
      clearInterval(activeProgressTimer);
      activeProgressTimer = null;
    }
    if (loadingSafetyTimeout) {
      clearTimeout(loadingSafetyTimeout);
      loadingSafetyTimeout = null;
    }
    const overlay = document.getElementById("globalLoadingOverlay");
    if (overlay) overlay.classList.remove("active");
    const topBar = document.getElementById("topProgressBar");
    if (topBar) {
      topBar.classList.remove("active");
      topBar.style.width = "0%";
    }
  }

  async function finishProgress(doneMessage = "Selesai 100%!") {
    if (activeProgressTimer) {
      clearInterval(activeProgressTimer);
      activeProgressTimer = null;
    }
    if (loadingSafetyTimeout) {
      clearTimeout(loadingSafetyTimeout);
      loadingSafetyTimeout = null;
    }
    updateProgressBar(100, "Berhasil!", doneMessage);
    await new Promise((r) => setTimeout(r, 160));
    const overlay = document.getElementById("globalLoadingOverlay");
    if (overlay) overlay.classList.remove("active");
    const topBar = document.getElementById("topProgressBar");
    if (topBar) {
      topBar.style.width = "100%";
      setTimeout(() => {
        topBar.classList.remove("active");
        topBar.style.width = "0%";
      }, 250);
    }
  }

  /* === 3. FLOATING WINDOW STACK & NAVIGATION CONTROLLER === */
  let modalHistory = [];
  let currentModalView = null;

  function resetModalStack() {
    modalHistory = [];
    currentModalView = null;
    updateModalNavUI();
  }

  function captureCurrentModalState() {
    if (!currentModalView) return null;
    const popupBody = document.getElementById("popupBody");
    if (!popupBody) return null;

    // Preservasi isi form & input agar tidak hilang saat navigasi bolak-balik
    popupBody.querySelectorAll("input, select, textarea").forEach((el) => {
      if (el.type === "checkbox" || el.type === "radio") {
        if (el.checked) el.setAttribute("checked", "checked");
        else el.removeAttribute("checked");
      } else if (el.tagName === "SELECT") {
        el.querySelectorAll("option").forEach((opt) => {
          if (opt.value === el.value) opt.setAttribute("selected", "selected");
          else opt.removeAttribute("selected");
        });
      } else if (el.tagName === "TEXTAREA") {
        el.textContent = el.value;
      } else {
        el.setAttribute("value", el.value);
      }
    });

    const popup = document.querySelector(".popup");
    return {
      viewId: currentModalView.viewId,
      title: currentModalView.title || "",
      sheet: currentModalView.sheet || "",
      html: popupBody.innerHTML,
      scrollTop: popup ? popup.scrollTop : 0,
    };
  }

  function updateModalNavUI() {
    const backBtn = document.getElementById("modalBackBtn");
    const closeAllBtn = document.getElementById("modalCloseAllBtn");
    const closeBtn = document.querySelector(".popup .close");

    if (modalHistory.length > 0) {
      if (backBtn) {
        backBtn.style.display = "inline-flex";
        const prev = modalHistory[modalHistory.length - 1];
        backBtn.title = `Kembali ke ${prev.title || "jendela sebelumnya"}`;
      }
      if (closeAllBtn) closeAllBtn.style.display = "inline-flex";
      if (closeBtn) closeBtn.title = "Kembali ke jendela sebelumnya";
    } else {
      if (backBtn) backBtn.style.display = "none";
      if (closeAllBtn) closeAllBtn.style.display = "none";
      if (closeBtn) closeBtn.title = "Tutup jendela";
    }
  }

  function showOverlay(html, meta = {}) {
    hideLoading();

    const newViewId = meta.viewId || "view_" + Date.now();
    const newTitle = meta.title || "";
    const newSheet = meta.sheet || window.currentSheet || "";

    // Simpan jendela aktif saat ini ke stack jika berpindah ke jendela baru
    if (currentModalView && currentModalView.viewId !== newViewId) {
      const existingIdx = modalHistory.findIndex((m) => m.viewId === newViewId);
      if (existingIdx !== -1) {
        modalHistory = modalHistory.slice(0, existingIdx);
      } else {
        const saved = captureCurrentModalState();
        if (saved) modalHistory.push(saved);
      }
    }

    currentModalView = {
      viewId: newViewId,
      title: newTitle,
      sheet: newSheet,
    };

    document.getElementById("popupBody").innerHTML = html;
    document.getElementById("overlay").style.display = "flex";

    const popup = document.querySelector(".popup");
    if (popup) popup.scrollTop = 0;

    updateModalNavUI();
  }

  function closeOverlay(forceCloseAll = false) {
    hideLoading();

    // Jika ada riwayat floating window sebelumnya dan bukan force close all:
    if (!forceCloseAll && modalHistory.length > 0) {
      const prev = modalHistory.pop();
      currentModalView = {
        viewId: prev.viewId,
        title: prev.title,
        sheet: prev.sheet,
      };
      document.getElementById("popupBody").innerHTML = prev.html;
      document.getElementById("overlay").style.display = "flex";
      const popup = document.querySelector(".popup");
      if (popup && prev.scrollTop) popup.scrollTop = prev.scrollTop;
      updateModalNavUI();
      return;
    }

    // Tutup seluruhnya jika riwayat kosong atau forceCloseAll = true
    modalHistory = [];
    currentModalView = null;
    document.getElementById("overlay").style.display = "none";
    document.getElementById("popupBody").innerHTML = "";
    updateModalNavUI();
  }

  /* === ISI PRESENSI === */
  async function openPresensi(sheet) {
    try {
      showLoading("Memuat data presensi...", "Mengambil daftar siswa kelas...");
      const data = await getSheetData(sheet, "headers");
      if (data.error) {
        await finishProgress("Gagal");
        return showOverlay("<p style='color:red'>" + data.error + "</p>", {
          viewId: "presensi_" + sheet,
          title: "Isi Presensi",
          sheet,
        });
      }
      const headers = data.headers || [];

      // Form password dipindahkan ke bawah
      const passForm = `
      <div style="margin-top:15px; margin-bottom:10px;">
        <label style="font-weight:600; display:block; margin-bottom:4px;">Password Kelas</label>
        <input type='password' id='presPass' class='input' style="margin-bottom:0;" placeholder='Masukkan password kelas'>
      </div>`;

      let html = `<h3 style="margin-top:0;">Isi Presensi — ${sheet}</h3><form id='formPresensi'>`;

      // Form daftar siswa/presensi
      headers.forEach((h) => {
        html += `<div><b style="font-size:14px;">${h}</b><br>
      <select name='${h}' class='input select-presensi hadir' onchange="updateSelectColor(this)">
        <option value="Hadir" class="opt-hadir">Hadir</option>
        <option value="Sakit" class="opt-sakit">Sakit</option>
        <option value="Izin" class="opt-izin">Izin</option>
        <option value="Alfa" class="opt-alfa">Alfa</option>
        <option value="Cabut" class="opt-cabut">Cabut</option>
      </select></div>`;
      });

      // Password diletakkan tepat di atas tombol Kirim
      html += `</form>${passForm}<div style='margin-top:20px; display:flex;'>
    <button class='action-save' onclick="submitPresensi('${sheet}')">Kirim</button>
    <button class='action-del' onclick="closeOverlay()">Batal</button></div>`;
      await finishProgress("Presensi Siap Diisi!");
      showOverlay(html, {
        viewId: "presensi_" + sheet,
        title: `Isi Presensi — ${sheet}`,
        sheet,
      });

  // perangkat dipakai bersama, pakai tombol "Logout Walas" di dalam
  // modal untuk menghapus cache-nya.
  let adminPasswordAktif = null;

  function getCacheWalas() {
    try {
      return JSON.parse(localStorage.getItem("walasAuth") || "{}");
    } catch (e) {
      return {};
    }
  }
  function simpanCacheWalas(sheet, password) {
    const cache = getCacheWalas();
    cache[sheet] = password;
    localStorage.setItem("walasAuth", JSON.stringify(cache));

  function hapusCacheWalas(sheet) {
    const cache = getCacheWalas();
    delete cache[sheet];
    localStorage.setItem("walasAuth", JSON.stringify(cache));

  async function postToAppsScript(payload, maxRetries = 1, timeoutMs = 12000) {
    for (let attempt = 0; attempt <= maxRetries; attempt++) {
      try {
        const r = await fetchJsonWithTimeout(
          SCRIPT_URL,
          {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload),
          },
          timeoutMs,
        );
        const text = await r.text();
        try {
          const parsed = JSON.parse(text);
          if (parsed && typeof parsed === "object") {
            return parsed;
          }
        } catch (err) {
          console.warn("GAS returned non-JSON response:", text.slice(0, 150));
        }
      } catch (netErr) {
        console.warn(`postToAppsScript attempt ${attempt + 1} failed:`, netErr);
      }
      if (attempt < maxRetries) {
        await new Promise((r) => setTimeout(r, 400));
      }
    }
    return {
      ok: false,
      error: "Respon server tidak valid atau koneksi terputus.",
    };
  }

  async function cekPasswordKeServer(sheet, password) {
    const pw = String(password || "").trim();
    if (!pw) return { ok: false, error: "Password tidak boleh kosong" };

    // Dulu ada 3 tahap cek berurutan (server verify -> cache header -> force
    // refresh header) yang total worst-case-nya bisa sampai ~48 detik kalau
    // server lambat. Sekarang disederhanakan jadi 2 tahap (worst-case ~28
    // detik), dan setiap tahap dicatat apakah gagalnya karena KONEKSI/SERVER
    // lambat atau memang PASSWORD salah, supaya pesannya akurat.
    let adaMasalahKoneksi = false;

    // TAHAP 1: Cek ke server Apps Script (action verifyAdminKelas)
    try {
      const j = await postToAppsScript(
        { action: "verifyAdminKelas", kelas: sheet, password: pw },
        1,
        7000,
      );
      if (j && j.ok) return { ok: true };
      // j ada tapi ok:false -> server sempat menjawab (mungkin memang salah,
      // atau action ini belum didukung backend). Bukan masalah koneksi,
      // lanjut ke tahap 2 sbg fallback tanpa menandai error koneksi.
    } catch (err) {
      console.warn("verifyAdminKelas network error:", err);
      adaMasalahKoneksi = true;
    }

    // TAHAP 2: Cocokkan dengan classPassword sheet / namaGuru (force refresh
    // langsung dari Google Sheets, jadi tidak perlu tahap ke-3 yang cuma
    // mengulang hal yang sama dengan data cache).
    try {
      const d = await getSheetData(sheet, "headers", true);
      adaMasalahKoneksi = false; // fetch ini berhasil, koneksi baik-baik saja
      if (d) {
        const cp = String(d.classPassword || "").trim();
        const ng = String(d.namaGuru || "").trim();
        if (cp && cp.toLowerCase() === pw.toLowerCase()) {
          return { ok: true };
        }
        if (
          ng &&
          (ng.toLowerCase().startsWith(pw.toLowerCase() + " ") ||
            ng.toLowerCase() === pw.toLowerCase())
        ) {
          return { ok: true };
        }
      }
    } catch (e) {
      console.warn("Gagal cek via sheet headers (force refresh):", e);
      adaMasalahKoneksi = true;
    }

    if (adaMasalahKoneksi) {
      return {
        ok: false,
        error:
          "Tidak dapat terhubung ke server (mungkin sedang sibuk). Silakan coba lagi — ini bukan berarti password salah.",
      };
    }
    return { ok: false, error: "Password admin salah!" };
  }

  // Token global: dipakai supaya hasil verifikasi yang datang terlambat
  // (mis. user sudah klik Batal, atau sudah coba login ulang) tidak
  // nyelonong membuka dashboard / menampilkan error secara tiba-tiba.
  let walasRequestToken = 0;

  function batalLoginWalas() {
    walasRequestToken++; // anggap basi proses verifikasi yg mungkin masih jalan
    closeOverlay();
  }

  async function submitWalasPromptPassword(sheet) {
    const btn = document.getElementById("btnMasukWalas");
    // Cegah klik ganda / Enter berkali-kali saat proses sebelumnya masih
    // berjalan — salah satu penyebab tampilan jadi tidak menentu karena
    // beberapa request numpuk bersamaan.
    if (btn && btn.disabled) return;

    const inp = document.getElementById("inputWalasPromptPassword");
    const pass = inp ? inp.value.trim() : "";
    if (!pass) {
      if (inp) inp.focus();
      return alert("Silakan masukkan password admin walas!");
    }

    const myToken = ++walasRequestToken;
    if (btn) {
      btn.disabled = true;
      btn.style.opacity = "0.6";
      btn.style.cursor = "not-allowed";
      btn.textContent = "Memverifikasi...";
    }
    if (inp) inp.disabled = true;

    // ⚡ MUNCULKAN LOADING BAR REALTIME SECARA INSTAN (0ms)!
    showLoading(
      "Login Walas — " + sheet,
      "Memverifikasi kredensial walas ke server...",
    );

    try {
      const j = await cekPasswordKeServer(sheet, pass);
      // Kalau sudah ada percobaan login baru / user sudah Batal, abaikan
      // saja hasil yang telat ini.
      if (myToken !== walasRequestToken) return;

      if (!j || !j.ok) {
        hideLoading();
        return showWalasLoginModal(sheet, j?.error || "Password admin salah!");
      }

      // Berhasil login
      adminPasswordAktif = pass;
      simpanCacheWalas(sheet, pass);

      updateProgressBar(
        65,
        "Login Walas Berhasil!",
        "Menyiapkan tabel data presensi...",
      );
      await openAdminModal(sheet);
    } catch (err) {
      if (myToken !== walasRequestToken) return;
      console.error("submitWalasPromptPassword error:", err);
      hideLoading();
      showWalasLoginModal(sheet, "Gagal login: " + (err.message || err));
    }
  }

  async function openAdminPrompt(sheet) {
    if (!sheet) {
      sheet = document.getElementById("kelasSelect")?.value;
      if (!sheet) return alert("Pilih kelas terlebih dahulu!");
    }

    const cache = getCacheWalas();
    const passTersimpan = cache[sheet];

    // ============================================================
    // 1. CEK PASSWORD YANG TERSIMPAN
    // ============================================================
    if (passTersimpan) {
      try {
        showLoading(
          "Login Walas — " + sheet,
          "Memeriksa sesi login yang tersimpan...",
        );

        const hasil = await cekPasswordKeServer(sheet, passTersimpan);

        // ========================================================
        // PASSWORD CACHE MASIH VALID
        // ========================================================
        if (hasil && hasil.ok) {
          adminPasswordAktif = passTersimpan;

          updateProgressBar(
            60,
            "Sesi Login Valid",
            "Menyiapkan dashboard walas...",
          );

          return await openAdminModal(sheet);
        }

        // ========================================================
        // PASSWORD CACHE SUDAH TIDAK VALID
        // Misalnya password Walas sudah diganti
        // ========================================================
        console.warn(
          "Password Walas tersimpan sudah tidak valid untuk kelas:",
          sheet,
        );

        hapusCacheWalas(sheet);
        adminPasswordAktif = null;

        hideLoading();

        // Tampilkan login ulang dengan pesan yang jelas
        return showWalasLoginModal(
          sheet,
          "Sesi login sebelumnya sudah tidak berlaku. Silakan masukkan password Walas yang baru.",
        );
      } catch (err) {
        console.error("Validasi cache login Walas gagal:", err);

        hideLoading();

        // Jangan langsung menghapus cache jika masalahnya hanya koneksi.
        // Pengguna masih diberi kesempatan login ulang.
        return showWalasLoginModal(
          sheet,
          "Gagal memeriksa sesi login. Silakan masukkan password Walas.",
        );
      }
    }

    // ============================================================
    // 2. BELUM ADA PASSWORD TERSIMPAN
    // ============================================================
    showWalasLoginModal(sheet);
  }

        return openKelolaSiswa(sheet);
      }
      invalidateSheetCache(sheet);
      await finishProgress("Sinkron Selesai 100%!");
      alert(j.message || "✅ Sinkron selesai");
      openKelolaSiswa(sheet);
    } catch (err) {
      alert("Gagal sinkron nama siswa: " + (err.message || err));
    }
  }

  /* === UPDATE: MODAL LOGIN WALAS DENGAN EDIT DATA LANGSUNG TERBUKA (PADAT & BERISI) === */
  // Guard anti tumpang-tindih: openAdminModal dipanggil dari beberapa
  // tempat (login sukses, cache password tersimpan, tombol Segarkan) yang
  // bisa terpicu berkali-kali sebelum proses sebelumnya selesai.
  let adminModalLoading = false;

  async function openAdminModal(sheet, forceRefresh = false) {
    if (adminModalLoading) return; // sudah ada proses buka dashboard yang berjalan
    adminModalLoading = true;
    const myToken = ++walasRequestToken;
    try {
      showLoading(
        "Login Walas — " + sheet,
        "Mengambil data presensi & hak akses...",
      );

      // Ambil seluruh baris data spreadsheet
      const d = await getSheetData(sheet, "all", forceRefresh);
      if (myToken !== walasRequestToken) return; // ada proses lain yg lebih baru
      if (!d || d.error) {
        hideLoading();
        alert(
          "Gagal memuat data kelas: " +
            (d?.error || "Koneksi ke spreadsheet terputus."),
        );
        return;
      }
      const rows = d.values || [];
      const namaGuru = d.namaGuru || "";

      window._rawHeaders = rows[0] || [];
      window._rawRows = rows.slice(1);
      window._rosterAktif = (window._rawHeaders || []).slice(2);
      window._rawByMonth = {};

      const pw = rows[1] && rows[1][1] ? rows[1][1] : d.classPassword || "";

      // Hitung data per bulan
      window._rawRows.forEach((row, i) => {
        const dt = new Date(row[0]);
        if (isNaN(dt)) return;
        const key = `${dt.getFullYear()}-${dt.getMonth()}`;
        if (!window._rawByMonth[key]) window._rawByMonth[key] = [];
        window._rawByMonth[key].push({ row, index: i });
      });

      const totalPertemuan = window._rawRows.length;
      const totalSiswa = window._rosterAktif.length;

      let html = `
      <div class="walas-dashboard-container">
        <!-- BARIS ATAS: HEADER & AKSI CEPAT -->
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <h3 style="margin:0;font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px;">
              <span>🏢</span> Dashboard Walas — <span style="color:var(--primary);">${sheet}</span>
            </h3>
            <span class="speed-mode-badge" style="margin:0;">⚡ Live Edit Ready</span>
            <span style="font-size:12px;font-weight:600;background:#e0f2fe;color:#0284c7;padding:3px 8px;border-radius:12px;">👥 ${totalSiswa} Siswa</span>
            <span style="font-size:12px;font-weight:600;background:#fef3c7;color:#b45309;padding:3px 8px;border-radius:12px;">📅 ${totalPertemuan} Pertemuan</span>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
            <button class="btn-compact action-save" style="background:#059669;" onclick="downloadDataMentahPDF('${sheet}')" title="Cetak Seluruh Data Mentah Harian Siswa (Format A4 Landscape)">
              🖨️ Cetak Data Mentah
            </button>
            <button class="btn-compact action-save" style="background:var(--info);" onclick="openFormLaporanWalas('${sheet}')" title="Cetak Formulir Laporan Walas Lengkap (A-D)">
              🖨️ Cetak Laporan (A-D)
            </button>
            <button class="btn-compact action-edit" style="background:#475569;" onclick="openKelolaSiswa('${sheet}')" title="Kelola Nama Siswa Kelas Ini">
              🧑‍🎓 Kelola Siswa
            </button>
            <button class="btn-compact" style="background:#e2e8f0;color:var(--dark);" onclick="openAdminModal('${sheet}', true)" title="Segarkan Data dari Server">
              🔄 Segarkan
            </button>
            <button class="btn-compact" style="background:#fee2e2;color:#b91c1c;" onclick="logoutWalas('${sheet}')" title="Keluar dari Sesi Walas">
              🚪 Logout
            </button>
          </div>
        </div>

        <!-- BARIS KEDUA: FORM IDENTITAS GURU WALI & PASSWORD KELAS (PADAT & BERISI) -->
        <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:10px;margin-bottom:12px;">
          <!-- Kartu Guru Wali Compact -->
          <div style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;">
            <span style="font-size:12px;font-weight:700;color:var(--dark);white-space:nowrap;">👤 Wali Kelas:</span>
            <input id="namaGuruWalas" class="input input-compact" style="margin:0;flex:1;min-width:130px;" placeholder="Nama Lengkap Walas" value="${String(namaGuru).replace(/"/g, "&quot;")}">
            <button class="action-save btn-compact" style="margin:0;white-space:nowrap;padding:4px 10px;" onclick="simpanNamaGuruDariModal('${sheet}')">💾 Simpan</button>
          </div>

          <!-- Kartu Password Presensi Siswa Compact -->
          <div style="background:#f8fafc;border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;">
            <span style="font-size:12px;font-weight:700;color:var(--dark);white-space:nowrap;">🔑 Password Kelas:</span>
            <input id="classPw" class="input input-compact" style="margin:0;flex:1;min-width:110px;" value="${String(pw).replace(/'/g, "&#39;")}" placeholder="Password Presensi Siswa">
            <button class="action-save btn-compact" style="margin:0;white-space:nowrap;padding:4px 10px;" onclick="setClassPassword('${sheet}')">💾 Simpan</button>
          </div>
        </div>

        <!-- BARIS KETIGA: TOOLBAR TABEL EDIT DATA (BULAN & TOMBOL AKSI) -->
        <div style="background:#ffffff;border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <label style="font-weight:700;font-size:13px;color:var(--dark);display:flex;align-items:center;gap:4px;">
              <span>📅</span> Filter Bulan:
            </label>
            <select id="editBulan" class="input input-compact" style="width:auto;min-width:160px;margin:0;font-weight:600;" onchange="renderEditTable()">
              <option value="ALL">Semua Bulan (${totalPertemuan} data)</option>
            </select>
          </div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <button class="btn-compact btn-walas" style="margin:0;background:#f59e0b;color:#fff;" onclick="tambahBarisTanggalBaru()">
              ➕ Tambah Tanggal
            </button>
            <button class="btn-compact action-save" style="margin:0;background:var(--primary);font-weight:700;" onclick="saveEditedRaw('${sheet}')">
              💾 Simpan Perubahan
            </button>
          </div>
        </div>

        <!-- BARIS KEEMPAT: TABEL DATA MENTAH PRESENSI DENGAN WRAPPER PADAT & BERISI -->
        <div class="table-compact-wrapper" style="margin-bottom:12px;">
          <table class="table table-compact">
            <thead>
              <tr>
                ${window._rawHeaders.map((h, idx) => `<th style="${idx < 2 ? "background:#e2e8f0;font-weight:700;" : ""}">${h}</th>`).join("")}
              </tr>
            </thead>
            <tbody id="editTbody"></tbody>
          </table>
        </div>

        <!-- FOOTER: TOMBOL SIMPAN & TUTUP -->
        <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:10px;flex-wrap:wrap;gap:8px;">
          <div style="font-size:12px;color:var(--text-muted);">
            💡 Tips: Ubah status kehadiran langsung pada kolom siswa, lalu klik <b>Simpan Perubahan</b>.
          </div>
          <div style="display:flex;gap:8px;">
            <button class="action-save btn-compact" style="padding:6px 18px;font-weight:700;" onclick="saveEditedRaw('${sheet}')">
              💾 Simpan Perubahan
            </button>
            <button class="action-del btn-compact" style="padding:6px 14px;" onclick="closeOverlay()">
              Tutup
            </button>
          </div>
        </div>
      </div>
      `;

      await finishProgress("Dashboard Walas Siap!");

      showOverlay(html, {
        viewId: "adminModal_" + sheet,
        title: `Login Walas — ${sheet}`,
        sheet,
      });

      // Isi opsi dropdown bulan
      const sel = document.getElementById("editBulan");
      if (sel) {
        Object.keys(window._rawByMonth)
          .sort()
          .forEach((k) => {
            const [y, m] = k.split("-");
            const nm = [
              "Januari",
              "Februari",
              "Maret",
              "April",
              "Mei",
              "Juni",
              "Juli",
              "Agustus",
              "September",
              "Oktober",
              "November",
              "Desember",
            ][m];
            const count = window._rawByMonth[k].length;
            sel.insertAdjacentHTML(
              "beforeend",
              `<option value="${k}">${nm} ${y} (${count})</option>`,
            );
          });
      }

      // Render isi tabel langsung
      renderEditTable();
      setTimeout(renderEditTable, 40);
    } catch (err) {
      if (myToken !== walasRequestToken) return;
      hideLoading();
      const pesan =
        err && err.isTimeout
          ? err.message
          : `Gagal memuat dashboard walas: ${err.message || err}`;
      showOverlay(
        `<div style="padding:20px;text-align:center;">
          <p style="color:var(--danger);font-weight:600;margin-bottom:16px;">❌ ${pesan}</p>
          <button class="action-save" style="margin:0;padding:8px 22px;font-weight:600;" onclick="openAdminModal('${sheet}', true)">
            🔄 Coba Lagi
          </button>
        </div>`,
        { viewId: "admin_error", title: "Error" },
      );
    } finally {
      adminModalLoading = false;
    }
  }

  /* === FUNGSI: TAMPILAN TAMBAH/HAPUS SISWA === */
  async function openKelolaSiswa(sheet) {
    try {
      showLoading("Memuat daftar siswa...", "Mengambil daftar nama siswa...");
      const d = await getSheetData(sheet, "headers");
      const headers = d.headers || [];

      let html = `
    <h3 style="margin-top:0;">🧑‍🎓 Tambah/Hapus Siswa — <span style="color:var(--primary);">${sheet}</span></h3>
    
    <div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;">
      <div id='list' style='max-height:50vh;overflow:auto;border:1px solid var(--border);padding:12px;border-radius:12px;background:#f8fafc;'>`;

      headers.forEach((h, i) => {
        html += `<div style='display:flex;gap:8px;margin-bottom:8px;align-items:center;'>
        <span style="width:24px;color:var(--text-muted);font-size:14px;">${i + 1}.</span>
        <input class='input nameInput' style="margin:0;" value='${h.replace(/'/g, "&#39;")}'>
        <button class='action-del' style="margin:0;padding:8px 12px;" onclick='this.parentElement.remove()'>✕</button>
      </div>`;
      });

      html += `</div>
      <p style="margin-top:12px;font-size:12px;color:var(--text-muted);">Penambahan siswa baru dilakukan lewat menu Guru Wali, lalu klik "🔄 Sinkron dari Data Siswa" di sini.</p>
      <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
        <button class='action-save' onclick="saveHeader('${sheet}')">Simpan Daftar</button>
        <button class='action-edit' onclick="syncNamaSiswaSheet('${sheet}')">🔄 Sinkron dari Data Siswa</button>
        <button class='action-del' onclick="closeOverlay()">⬅️ Kembali ke Dashboard</button>
      </div>
    </div>`;

      await finishProgress("Daftar Siswa Siap!");
      showOverlay(html, {
        viewId: "kelolaSiswa_" + sheet,
        title: `Kelola Siswa — ${sheet}`,
        sheet,
      });
    } catch (err) {
      showOverlay(
        `<p style='color:var(--danger);padding:20px;'>Gagal memuat: ${err.message || err}</p>`,
        { viewId: "kelola_error", title: "Error" },
      );
    }
  }

  /* === SIMPAN NAMA GURU WALI (tersimpan di server, muncul otomatis lagi) === */
  async function simpanNamaGuruDariModal(sheet) {
    const namaGuru = document.getElementById("namaGuruWalas").value.trim();
    if (!namaGuru) return alert("Nama wali kelas tidak boleh kosong.");
    if (!adminPasswordAktif) {
      return alert(
        "Sesi Login Walas tidak ditemukan, silakan tutup lalu Login Walas lagi.",
      );
    }

    try {
      showLoading(
        "Menyimpan nama guru...",
        "Memperbarui identitas guru wali...",
      );
      const j = await postToAppsScript({
        action: "simpanNamaGuruWalas",
        kelas: sheet,
        adminPassword: adminPasswordAktif,
        namaGuru,
      });
      if (j && j.ok) {
        invalidateSheetCache(sheet);
        await finishProgress("Nama Tersimpan!");
        alert("✅ Nama guru wali disimpan.");
        openAdminModal(sheet, true);
      } else {
        hideLoading();
        alert("❌ Gagal: " + (j?.error || "Terjadi kesalahan"));
      }
    } catch (err) {
      hideLoading();
      alert("Gagal menyimpan nama guru: " + (err.message || err));
    }
  }

  /* === LIHAT REKAP DARI DALAM FORM LAPORAN WALAS ===
     Membuka Rekap akan mengganti isi popup, jadi isian Lampiran B/C/D
     yang belum disimpan akan hilang — makanya dikonfirmasi dulu. */
  function lihatRekapDariLaporanWalas(sheet) {
    const adaIsian =
      document.querySelectorAll(
        "#tabelPermasalahan .walas-nama, #tabelKondisiKelas .walas-piket, #tabelKondisiKelas .walas-inventaris, #tabelMutasi .walas-nama",
      ).length > 0 &&
      [
        ...document.querySelectorAll(
          "#tabelPermasalahan input, #tabelKondisiKelas input, #tabelMutasi input",
        ),
      ].some((i) => i.value.trim());

    if (
      adaIsian &&
      !confirm(
        "Isian Lampiran B/C/D yang belum disimpan akan hilang kalau pindah ke Rekap. Lanjutkan?",
      )
    ) {
      return;
    }
    openRekap(sheet);
  }

  /* === LAPORAN WALAS: COVER + A. IDENTITAS + B. PERMASALAHAN SISWA +
     C. KONDISI KELAS + D. MUTASI SISWA ===
     Bagian B disimpan ke sheet WALAS (sesuai yang sudah dibuat manual
     di spreadsheet). Bagian C & D HANYA untuk kebutuhan cetak, tidak
     disimpan ke sheet manapun — sesuai permintaan (input saja). */
  async function openFormLaporanWalas(sheet) {
    if (!adminPasswordAktif) {
      return alert(
        "Sesi Login Walas tidak ditemukan, silakan tutup lalu Login Walas lagi.",
      );
    }

    const namaGuru =
      document.getElementById("namaGuruWalas")?.value.trim() ||
      window._namaGuruAktif ||
      "";
    window._namaGuruAktif = namaGuru; // simpan supaya tetap terbawa walau modal berganti
    window._sheetAktifLaporanWalas = sheet; // dipakai saat upload foto per baris

    const roster = window._rosterAktif || [];
    const jumlahSiswa = roster.length;
    const tanggalCetak = new Date().toLocaleDateString("id-ID", {
      day: "2-digit",
      month: "long",
      year: "numeric",
    });

    showLoading(
      "Memuat data laporan walas...",
      "Mengambil riwayat data & identitas...",
    );

    // Ambil data Lampiran B yang sudah pernah disimpan guru ini
    let itemPermasalahanLama = [];
    try {
      const r = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "getWalasPermasalahan",
          kelas: sheet,
          adminPassword: adminPasswordAktif,
          namaGuru,
        }),
      });
      const j = await r.json();
      if (j.ok) itemPermasalahanLama = j.items || [];
    } catch (err) {
      // gagal ambil data lama, lanjut dengan form kosong
    }

    // Ambil data mentah presensi untuk siapkan filter bulan Lampiran A
    window._dataMentahLampiranA = await ambilDataMentahUntukLampiranA(sheet);
    const bulanList = window._dataMentahLampiranA.bulanList || [];
    const opsiBulan =
      `<option value="ALL">Semua Bulan</option>` +
      bulanList
        .map((bk) => {
          const [thn, bln] = bk.split("-").map(Number);
          const label = new Date(thn, bln, 1).toLocaleDateString("id-ID", {
            month: "long",
            year: "numeric",
          });
          return `<option value="${bk}">${label}</option>`;
        })
        .join("");

    const datalistSiswa = `<datalist id="datalistSiswaWalas">${roster
      .map((n) => `<option value="${n.replace(/"/g, "&quot;")}">`)
      .join("")}</datalist>`;

    const htmlLaporan = `
      <h3 style="margin-top:0;">🖨️ Laporan Walas — ${sheet}</h3>

      <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:14px 16px;margin-bottom:18px;">
        <p style="margin:0 0 8px;font-size:13px;color:var(--dark);">
          <b>Wali Kelas:</b> ${namaGuru || "-"} &nbsp;|&nbsp;
          <b>Kelas:</b> ${sheet} &nbsp;|&nbsp;
          <b>Jumlah Siswa:</b> ${jumlahSiswa} &nbsp;|&nbsp;
          <b>Tanggal:</b> ${tanggalCetak}
        </p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
          <button class="action-edit" style="margin:0;padding:6px 12px;font-size:12px;" onclick="lihatRekapDariLaporanWalas('${sheet}')">📊 Lihat Rekap Kehadiran</button>
          <label style="font-size:12px;font-weight:600;color:var(--dark);">Lampiran A untuk bulan:</label>
          <select id="bulanLampiranA" class="input" style="margin:0;width:auto;min-width:150px;">${opsiBulan}</select>
        </div>
        <p class="small" style="margin:8px 0 0;color:var(--text-muted);">Lampiran A (Rekap Kehadiran) otomatis disertakan saat PDF dicetak sesuai bulan yang dipilih di atas.</p>
      </div>

      ${datalistSiswa}

      <h4 style="margin-bottom:8px;">LAMPIRAN B. Permasalahan Siswa</h4>
      <div id="tabelPermasalahan"></div>
      <button class="action-edit" style="margin-top:4px;" onclick="tambahBarisWalas('tabelPermasalahan','permasalahan')">➕ Tambah Baris</button>

      <h4 style="margin:22px 0 8px;">LAMPIRAN C. Kondisi Kelas</h4>
      <div id="tabelKondisiKelas"></div>
      <button class="action-edit" style="margin-top:4px;" onclick="tambahBarisWalas('tabelKondisiKelas','kondisi')">➕ Tambah Baris</button>

      <h4 style="margin:22px 0 8px;">LAMPIRAN D. Mutasi Siswa</h4>
      <div id="tabelMutasi"></div>
      <button class="action-edit" style="margin-top:4px;" onclick="tambahBarisWalas('tabelMutasi','mutasi')">➕ Tambah Baris</button>

      <div style="margin-top:24px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:16px;">
        <button class="action-save" onclick="simpanDanCetakLaporanWalas('${sheet}')">💾 Simpan &amp; Cetak PDF</button>
        <button class="action-del" onclick="closeOverlay()">Kembali</button>
      </div>
    `;

    await finishProgress("Form Laporan Siap!");
    showOverlay(htmlLaporan, {
      viewId: "formWalas_" + sheet,
      title: `Laporan Walas — ${sheet}`,
      sheet,
    });

    // Lampiran B: isi ulang dari data lama kalau ada, kalau tidak 1 baris kosong
    if (itemPermasalahanLama.length > 0) {
      itemPermasalahanLama.forEach((it) =>
        tambahBarisWalas("tabelPermasalahan", "permasalahan", it),
      );
    } else {
      tambahBarisWalas("tabelPermasalahan", "permasalahan");
    }
    tambahBarisWalas("tabelKondisiKelas", "kondisi");
    tambahBarisWalas("tabelMutasi", "mutasi");
  }

  function tambahBarisWalas(containerId, jenis, prefill) {
    const container = document.getElementById(containerId);
    if (!container) return;

    const esc = (v) => String(v || "").replace(/"/g, "&quot;");

    const div = document.createElement("div");
    div.className = "baris-walas";
    div.style.cssText =
      "display:flex;gap:8px;margin-bottom:8px;align-items:flex-start;flex-wrap:wrap;";

    if (jenis === "permasalahan") {
      div.innerHTML = `
        <input class="input walas-nama" list="datalistSiswaWalas" style="margin:0;flex:1;min-width:140px;" placeholder="Nama Siswa" value="${esc(prefill?.namaSiswa)}">
        <input class="input walas-proses" style="margin:0;flex:2;min-width:180px;" placeholder="Proses Penyelesaian" value="${esc(prefill?.proses)}">
        <input class="input walas-ket" style="margin:0;flex:1;min-width:140px;" placeholder="Keterangan" value="${esc(prefill?.keterangan)}">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;min-width:76px;">
          <input type="file" accept="image/*" class="walas-foto-file" style="font-size:10px;width:76px;" onchange="uploadFotoPermasalahanRow(this)">
          <img class="walas-foto-preview" src="${esc(prefill?.fotoUrl)}" style="width:36px;height:36px;object-fit:cover;border-radius:6px;border:1px solid var(--border);${prefill?.fotoUrl ? "" : "display:none;"}">
          <input type="hidden" class="walas-foto-url" value="${esc(prefill?.fotoUrl)}">
        </div>
        <button class="action-del" style="margin:0;padding:8px 12px;" onclick="this.parentElement.remove()">✕</button>`;
    } else if (jenis === "kondisi") {
      div.innerHTML = `
        <input class="input walas-piket" style="margin:0;flex:1;min-width:140px;" placeholder="Pelaksanaan Piket">
        <input class="input walas-inventaris" style="margin:0;flex:1;min-width:140px;" placeholder="Inventaris Kelas">
        <input class="input walas-ket" style="margin:0;flex:1;min-width:140px;" placeholder="Keterangan">
        <button class="action-del" style="margin:0;padding:8px 12px;" onclick="this.parentElement.remove()">✕</button>`;
    } else if (jenis === "mutasi") {
      div.innerHTML = `

  /* === UPLOAD FOTO PER BARIS LAMPIRAN B ===
     Foto dikompres dulu di browser (biar tidak berat), lalu diupload
     ke Google Drive lewat GAS. URL hasilnya disimpan di input hidden
     .walas-foto-url, dipakai nanti untuk bikin barcode/QR saat cetak. */
  function kompresGambarUntukUpload(file, maxDim = 900, quality = 0.7) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          if (w > h && w > maxDim) {
            h = Math.round(h * (maxDim / w));
            w = maxDim;
          } else if (h > maxDim) {
            w = Math.round(w * (maxDim / h));
            h = maxDim;
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = () => reject(new Error("Gagal membaca gambar."));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error("Gagal membaca file."));
      reader.readAsDataURL(file);
    });
  }

  async function uploadFotoPermasalahanRow(inputEl) {
    const file = inputEl.files[0];
    if (!file) return;

    const div = inputEl.closest(".baris-walas");
    const preview = div.querySelector(".walas-foto-preview");
    const hiddenUrl = div.querySelector(".walas-foto-url");

    if (!adminPasswordAktif || !window._sheetAktifLaporanWalas) {
      alert("Sesi Login Walas tidak ditemukan, silakan Login Walas lagi.");
      inputEl.value = "";
      return;
    }

    inputEl.disabled = true;
    try {
      const base64 = await kompresGambarUntukUpload(file);

      const r = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "uploadFotoPermasalahan",
          kelas: window._sheetAktifLaporanWalas,
          adminPassword: adminPasswordAktif,
          base64Data: base64,
          fileName: `permasalahan_${Date.now()}.jpg`,
          mimeType: "image/jpeg",
        }),
      });
      const j = await r.json();

      if (!j.ok) {
        alert("❌ Gagal upload foto: " + (j.error || "Terjadi kesalahan"));
        return;
      }

      hiddenUrl.value = j.url;
      preview.src = j.url;
      preview.style.display = "block";
    } catch (err) {
      alert("Gagal upload foto: " + (err.message || err));
    } finally {
      inputEl.disabled = false;
    }
  }
