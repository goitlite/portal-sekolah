<!-- ✅ PRESENSI TJKT FINAL 2025 — Versi Profesional UI (Tabel Berwarna & Tombol Admin) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>

<style>
  /* === Variabel Warna & Tema Profesional === */
  :root {
    --bg: #f8fafc;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --info: #0ea5e9;
    --info-hover: #0284c7;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #f59e0b;
    --dark: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --card-shadow:
      0 4px 10px -1px rgba(245, 158, 11, 0.1),
      0 2px 4px -1px rgba(0, 0, 0, 0.03);
    --card-shadow-hover:
      0 20px 25px -5px rgba(245, 158, 11, 0.2),
      0 10px 10px -5px rgba(245, 158, 11, 0.06);
  }

  body {
    margin: 0;
    background: var(--bg);
    font-family: "Inter", Arial, sans-serif;
    color: var(--dark);
    line-height: 1.5;
  }

  .presensi-root {
    padding: 40px 20px 60px;
  }

  .presensi-root h2 {
    margin: 0 0 40px;
    color: var(--dark);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    text-align: center;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  /* === Badge Judul Penting === */
  .badge-title {
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 30px;
    box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border: 2px solid #fff;
  }

  .presensi-grid {
    display: grid !important;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
    min-height: 200px;
  }

  /* === Kartu Kelas === */
  .kelas-card {
    background: linear-gradient(135deg, #ffffff 0%, #fffdf0 50%, #fef08a 100%);
    border-radius: 16px;
    padding: 30px 24px;
    box-shadow: var(--card-shadow);
    text-align: center;
    position: relative;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid #fde047;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .kelas-card::before {
    content: "📚";
    font-size: 42px;
    display: block;
    margin-bottom: 12px;
    filter: drop-shadow(0 4px 6px rgba(245, 158, 11, 0.2));
  }

  .kelas-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--card-shadow-hover);
    border-color: #facc15;
  }

  .kelas-card h3 {
    margin: 0 0 20px;
    font-size: 20px;
    color: var(--dark);
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .kelas-card.tingkat-x {
    border-top: 5px solid #3b82f6;
  }
  .kelas-card.tingkat-xi {
    border-top: 5px solid #10b981;
  }
  .kelas-card.tingkat-xii {
    border-top: 5px solid #f59e0b;
  }

  /* === Tombol === */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: calc(100% - 12px);
    margin: 6px;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .btn-isi {
    background: var(--primary);
    color: #fff;
  }
  .btn-isi:hover {
    background: var(--primary-hover);
    transform: scale(1.02);
  }
  .btn-isi:active {
    transform: scale(0.98);
  }

  .btn-rekap {
    background: var(--info);
    color: #fff;
  }
  .btn-rekap:hover {
    background: var(--info-hover);
    transform: scale(1.02);
  }
  .btn-rekap:active {
    transform: scale(0.98);
  }

  .btn-admin {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 20px;
    background: transparent;
    border: none;
    cursor: pointer;
    opacity: 0.4;
    transition: all 0.2s;
    padding: 4px;
  }
  .btn-admin:hover {
    opacity: 1;
    transform: rotate(45deg);
  }

  /* === Form Element === */
  .input,
  select,
  textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 12px;
    font-family: inherit;
    color: var(--dark);
    background-color: #fff;
    transition: all 0.2s;
    box-sizing: border-box;
  }

  .input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  /* === Popup Overlay === */
  .popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 24px;
    backdrop-filter: blur(5px);
  }
  .popup-overlay[style*="flex"] {
    pointer-events: auto;
  }
  .popup-overlay:not([style*="flex"]) {
    pointer-events: none;
  }

  .popup {
    background: #fff;
    border-radius: 20px;
    width: 100%;
    max-width: 900px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    padding: 32px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    animation: popupFade 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes popupFade {
    from {
      opacity: 0;
      transform: translateY(10px) scale(0.98);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .close {
    position: absolute;
    right: 20px;
    top: 20px;
    background: #f1f5f9;
    color: var(--text-muted);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: bold;
    font-size: 16px;
  }
  .close:hover {
    background: #e2e8f0;
    color: var(--danger);
    transform: rotate(90deg);
  }

  /* === Tombol Aksi di Popup === */
  .action-btn,
  .action-save,
  .action-edit,
  .action-del {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
    font-family: inherit;
    margin-right: 6px;
  }
  .action-save {
    background: var(--success);
    color: #fff;
  }
  .action-edit {
    background: var(--warning);
    color: #fff;
  }
  .action-del {
    background: var(--danger);
    color: #fff;
  }

  .action-save:hover,
  .action-edit:hover,
  .action-del:hover {
    filter: brightness(1.1);
    transform: translateY(-2px);
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }
  .action-save:active,
  .action-edit:active,
  .action-del:active {
    transform: translateY(0);
  }

  /* === Tabel (Desain Clean dengan Sentuhan Warna Elegan) === */
  .table-freeze-wrapper {
    max-height: 65vh;
    overflow: auto;
    position: relative;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.02);
  }

  .table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 14px;
  }
  .table th,
  .table td {
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  .table th:last-child,
  .table td:last-child {
    border-right: none;
  }

  /* Header Tabel Warna Emas/Kuning Halus */
  .table th {
    background: linear-gradient(135deg, #fffbeb, #fef3c7);
    font-weight: 600;
    color: #92400e;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.5px;
    border-bottom: 2px solid #fde68a;
  }
  .table tr:last-child td {
    border-bottom: none;
  }
  /* Zebra cross table (selang-seling warna) */
  .table tbody tr:nth-child(even) td {
    background: #fffdf0;
  }
  .table tbody tr:hover td {
    background: #fef9c3;
  }

  /* Freeze Header & Kolom Kiri */
  .table-freeze-wrapper thead th {
    position: sticky;
    top: 0;
    background: #fffbeb;
    z-index: 3;
    box-shadow: 0 2px 0 #fde68a;
  }
  .table-freeze-wrapper th:first-child,
  .table-freeze-wrapper td:first-child {
    position: sticky;
    left: 0;
    background: #fff;
    z-index: 2;
    box-shadow: 2px 0 0 var(--border);
  }
  /* Efek Hover dan Zebra di Kolom Kiri (Freeze) */
  .table-freeze-wrapper tr:nth-child(even) td:first-child {
    background: #fffdf0;
  }
  .table-freeze-wrapper tr:hover td:first-child {
    background: #fef9c3;
  }
  .table-freeze-wrapper thead th:first-child {
    z-index: 4;
    background: #fffbeb;
    box-shadow: 2px 2px 0 #fde68a;
  }

  /* Scrollbar Elegan untuk Tabel & Popup */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: #f1f5f9;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  /* === Details & Summary === */
  details {
    background: #f8fafc;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  details summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--dark);
    list-style: none;
    display: flex;
    align-items: center;
  }
  details summary::before {
    content: "▸";
    margin-right: 8px;
    transition: transform 0.2s;
  }
  details[open] summary::before {
    transform: rotate(90deg);
  }
  details p {
    margin: 12px 0 0;
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* === DATA MENTAH FULL HEIGHT === */
  .raw-full {
    max-height: calc(100vh - 180px);
    overflow-y: auto;
  }

  /* === WARNA PERSENTASE KEHADIRAN (Lebih Halus) === */
  .persen-merah {
    background: #fee2e2 !important;
    color: #b91c1c !important;
    font-weight: 700;
    text-align: center;
  }
  .persen-kuning {
    background: #fef3c7 !important;
    color: #b45309 !important;
    font-weight: 700;
    text-align: center;
  }
  .persen-hijau {
    background: #dcfce7 !important;
    color: #15803d !important;
    font-weight: 700;
    text-align: center;
  }

  /* =========================================
   === RESPONSIVE PADAT (COMPACT) MOBILE ===
   ========================================= */
  @media (max-width: 720px) {
    .presensi-root {
      padding: 16px 12px 30px;
    }
    .presensi-root h2 {
      font-size: 20px;
      margin-bottom: 24px;
      gap: 6px;
    }
    .presensi-grid {
      gap: 12px;
      grid-template-columns: 1fr;
    }

    .kelas-card {
      padding: 20px 16px;
      min-height: 140px;
    }
    .kelas-card::before {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .kelas-card h3 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      margin: 4px 0;
      padding: 10px;
      font-size: 13px;
      border-radius: 8px;
    }
    .input,
    select,
    textarea {
      padding: 8px 12px;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .popup-overlay {
      padding: 12px;
    }
    .popup {
      max-width: 100%;
      padding: 20px 16px;
      border-radius: 12px;
    }
    .close {
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      font-size: 14px;
    }

    .table th,
    .table td {
      padding: 8px 10px;
      font-size: 12px;
    }
    .table th {
      font-size: 11px;
    }

    .action-save,
    .action-edit,
    .action-del {
      padding: 8px 12px;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .badge-title {
      font-size: 11px;
      padding: 4px 12px;
    }
  }

  /* Animasi Loading Spinner */
  .loading-box {
    text-align: center;
    padding: 40px;
  }
  .spinner {
    border: 4px solid #e2e8f0;
    border-top: 4px solid var(--primary);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
  }
  .loading-text {
    font-weight: 500;
    color: var(--text-muted);
  }
  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
</style>

<div class="presensi-root">
  <h2>
    📋 Presensi TJKT <span class="badge-title">SMKN 1 TELUK KUANTAN</span>
  </h2>
  <div id="kelasGrid" class="presensi-grid"></div>
</div>

<div id="overlay" class="popup-overlay">
  <div class="popup">
    <div class="close" onclick="closeOverlay()">✕</div>
    <div id="popupBody"></div>
  </div>
</div>

<script>
  function hitungTotalPertemuanAll() {
    const setHari = new Set();
    Object.values(window._bulanan || {}).forEach((perSiswa) => {
      Object.values(perSiswa).forEach((b) => {
        b.hari.forEach((h) => setHari.add(h));
      });
    });
    return setHari.size;
  }

  function updateJudulRekap(bulanKey) {
    const judul = document.getElementById("rekapJudul");
    const sub = document.getElementById("rekapSubJudul");
    if (!judul || !sub) return;

    if (bulanKey === "ALL") {
      judul.innerText = "📊 Rekap Kehadiran";
      sub.innerHTML = `Kelas: <b>${currentSheet}</b> — Semua Bulan`;
      return;
    }

    const [y, m] = bulanKey.split("-");
    const namaBulan = [
      "Januari",
      "Februari",
      "Maret",
      "April",
      "Mei",
      "Juni",
      "Juli",
      "Agustus",
      "September",
      "Oktober",
      "November",
      "Desember",
    ];
    judul.innerText = "📊 Rekap Kehadiran";
    sub.innerHTML = `Kelas: <b>${currentSheet}</b> — Bulan: <b>${namaBulan[+m]} ${y}</b>`;
  }

  /* === KONFIGURASI === */
  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbyPCKZSnnr_O6yRKBgok2XEHC9MRERDFa8t5a-SO5RPDy52xnQknAxgCFlUzouSBVfP/exec";
  const KELAS = [
    { id: "XTJKT1", label: "X TJKT 1", cls: "tingkat-x", adminPw: "tjkt31" },
    { id: "XTJKT2", label: "X TJKT 2", cls: "tingkat-x", adminPw: "tjkt32" },
    { id: "XITJKT1", label: "XI TJKT 1", cls: "tingkat-xi", adminPw: "tjkt33" },
    { id: "XITJKT2", label: "XI TJKT 2", cls: "tingkat-xi", adminPw: "tjkt34" },
    {
      id: "XIITJKT1",
      label: "XII TJKT 1",
      cls: "tingkat-xii",
      adminPw: "tjkt35",
    },
    {
      id: "XIITJKT2",
      label: "XII TJKT 2",
      cls: "tingkat-xii",
      adminPw: "tjkt36",
    },
  ];

  /* === RENDER 1 CARD SAJA === */
  const grid = document.getElementById("kelasGrid");

  const el = document.createElement("div");
  el.className = "kelas-card tingkat-x";
  el.innerHTML = `
  <h3>Presensi TJKT</h3>

  <select id="kelasSelect" class="input">
    ${KELAS.map((k) => `<option value="${k.id}">${k.label}</option>`).join("")}
  </select>

  <button class="btn btn-isi" onclick="openPresensi(document.getElementById('kelasSelect').value)">
    Isi Presensi
  </button>

  <button class="btn btn-rekap" onclick="openRekap(document.getElementById('kelasSelect').value)">
    Rekap
  </button>

  <button class="btn-admin" onclick="openAdminBySelect()">⚙️</button>
`;
  grid.appendChild(el);

  /* === ADMIN BERDASARKAN DROPDOWN === */
  function openAdminBySelect() {
    const sheet = document.getElementById("kelasSelect").value;
    openAdminPrompt(sheet);
  }

  /* === POPUP HELPERS === */
  function showOverlay(html) {
    document.getElementById("popupBody").innerHTML = html;
    document.getElementById("overlay").style.display = "flex";
  }
  function showLoading(text = "Memuat data...") {
    showOverlay(`
    <div class="loading-box">
      <div class="spinner"></div>
      <div class="loading-text">${text}</div>
    </div>
  `);
  }
  function closeOverlay() {
    document.getElementById("overlay").style.display = "none";
  }

  /* === ISI PRESENSI === */
  async function openPresensi(sheet) {
    try {
      showLoading("Memuat data presensi...");
      const res = await fetch(`${SCRIPT_URL}?sheet=${sheet}`);
      const data = await res.json();
      if (data.error)
        return showOverlay("<p style='color:red'>" + data.error + "</p>");
      const headers = data.headers || [];
      const passForm = `
      <div><label style="font-weight:600;">Password Kelas</label>
      <input type='password' id='presPass' class='input' placeholder='Masukkan password kelas'></div>`;
      let html = `<h3 style="margin-top:0;">Isi Presensi — ${sheet}</h3>${passForm}<form id='formPresensi'>`;
      headers.forEach((h) => {
        html += `<div><b style="font-size:14px;">${h}</b><br>
      <select name='${h}' class='input'>
        <option>Hadir</option><option>Sakit</option><option>Izin</option>
        <option>Alfa</option><option>Cabut</option></select></div>`;
      });
      html += `</form><div style='margin-top:20px; display:flex;'>
    <button class='action-save' onclick="submitPresensi('${sheet}')">Kirim</button>
    <button class='action-del' onclick="closeOverlay()">Batal</button></div>`;
      showOverlay(html);
    } catch (err) {
      showOverlay(
        `<p style='color:var(--danger);padding:20px;'>Gagal memuat presensi: ${err.message || err}</p>`,
      );
    }
  }

  async function submitPresensi(sheet) {
    try {
      const pass = document.getElementById("presPass").value.trim();
      const res = await fetch(`${SCRIPT_URL}?sheet=${sheet}`);
      const d = await res.json();
      if (d.classPassword !== pass) {
        alert("❌ Password kelas salah!");
        return;
      }
      const form = document.getElementById("formPresensi");
      const entries = {};
      for (let el of form.elements) {
        if (el.name) entries[el.name] = el.value;
      }
      const body = {
        action: "addPresensi",
        kelas: sheet,
        password: pass,
        entries,
      };
      const r = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(body),
      });
      const j = await r.json();
      if (j.ok) {
        alert("✅ Presensi tersimpan");
        closeOverlay();
      } else {
        alert("❌ Gagal: " + (j.error || "Terjadi kesalahan"));
      }
    } catch (err) {
      alert("❌ Gagal mengirim presensi: " + (err.message || err));
    }
  }

  /* === ADMIN === */
  function openAdminPrompt(sheet) {
    const k = KELAS.find((x) => x.id === sheet);
    const inpw = prompt(`Masukkan password admin untuk ${k.label}`);
    if (inpw !== k.adminPw) return alert("Password admin salah!");
    openAdminModal(sheet);
  }

  async function openAdminModal(sheet) {
    try {
      showLoading("Memuat admin...");
      const res = await fetch(`${SCRIPT_URL}?sheet=${sheet}`);
      const d = await res.json();
      const headers = d.headers || [];
      const pw = d.classPassword || "";
      let html = `<h3 style="margin-top:0;">Admin — ${sheet}</h3>
    <div><label style="font-weight:600;">Password kelas:</label><div style="display:flex;gap:8px;">
    <input id='classPw' class='input' style="margin:0;" value='${pw.replace(/'/g, "&#39;")}' placeholder='Isi password kelas'>
    <button class='action-save' style="margin:0;" onclick="setClassPassword('${sheet}')">Simpan</button></div></div>
    <div style='margin-top:20px'><label style="font-weight:600;">Daftar siswa:</label>
    <div id='list' style='max-height:40vh;overflow:auto;border:1px solid var(--border);padding:12px;border-radius:12px;background:#f8fafc;'>`;
      headers.forEach(
        (h, i) =>
          (html += `<div style='display:flex;gap:8px;margin-bottom:8px;align-items:center;'>
    <span style="width:24px;color:var(--text-muted);font-size:14px;">${i + 1}.</span><input class='input nameInput' style="margin:0;" value='${h.replace(/'/g, "&#39;")}'>
    <button class='action-del' style="margin:0;padding:8px 12px;" onclick='this.parentElement.remove()'>✕</button></div>`),
      );
      html += `</div><div style='margin-top:12px;display:flex;gap:8px'>

  /* === FORMAT TIMESTAMP → DD/MM/YYYY === */
  function formatTanggal(value) {
    const d = new Date(value);
    if (isNaN(d)) return value;
    const dd = d.getDate().toString().padStart(2, "0");
    const mm = (d.getMonth() + 1).toString().padStart(2, "0");
    const yyyy = d.getFullYear();
    return `${dd}/${mm}/${yyyy}`;
  }

  function applyBulanFilter(bulanKey) {
    let setHariBulan = new Set();
    let totalSiswa = 0;
    let totalHadir = 0;
    let totalPertemuan = 0;

    updateJudulRekap(bulanKey);
    document.querySelectorAll(".rekap-row").forEach((row) => {
      const nama = row.dataset.nama;

      if (bulanKey === "ALL") {
        row.querySelector(".col-hadir").innerText = row.dataset.hadir;
        row.querySelector(".col-sakit").innerText = row.dataset.sakit;
        row.querySelector(".col-izin").innerText = row.dataset.izin;
        row.querySelector(".col-alfa").innerText = row.dataset.alfa;
        row.querySelector(".col-cabut").innerText = row.dataset.cabut;

        const td = row.querySelector(".col-persen");
        const persenNum = parseFloat(row.dataset.persen);

        td.innerText = persenNum.toFixed(2) + "%";

        td.classList.remove("persen-merah", "persen-kuning", "persen-hijau");

        if (persenNum < 50) td.classList.add("persen-merah");
        else if (persenNum < 70) td.classList.add("persen-kuning");
        else td.classList.add("persen-hijau");

        totalSiswa++;
        totalHadir += parseInt(row.dataset.hadir || 0);
        return;
      }

      const r = window._bulanan?.[nama]?.[bulanKey];
      if (!r) {
        row.querySelector(".col-hadir").innerText = "0";
        row.querySelector(".col-sakit").innerText = "0";
        row.querySelector(".col-izin").innerText = "0";
        row.querySelector(".col-alfa").innerText = "0";
        row.querySelector(".col-cabut").innerText = "0";
        row.querySelector(".col-persen").innerText = "0%";
        return;
      }

      if (r) {
        totalSiswa++;
        totalHadir += r.hadir;
        r.hari.forEach((h) => {
          setHariBulan.add(h);
        });
      }

      row.querySelector(".col-hadir").innerText = r.hadir;
      row.querySelector(".col-sakit").innerText = r.sakit;
      row.querySelector(".col-izin").innerText = r.izin;
      row.querySelector(".col-alfa").innerText = r.alfa;
      row.querySelector(".col-cabut").innerText = r.cabut;

      const total = r.hari.size;
      const persenNum = total ? (r.hadir / total) * 100 : 0;

      const td = row.querySelector(".col-persen");

      td.classList.remove("persen-merah", "persen-kuning", "persen-hijau");

      if (persenNum < 50) {
        td.classList.add("persen-merah");
      } else if (persenNum < 70) {
        td.classList.add("persen-kuning");
      } else {
        td.classList.add("persen-hijau");
      }

      td.innerText = persenNum.toFixed(2) + "%";
    });

    if (bulanKey === "ALL") {
      totalPertemuan = hitungTotalPertemuanAll();
    } else {
      totalPertemuan = setHariBulan.size;
    }

    document.getElementById("ringTotalSiswa").innerText = totalSiswa;
    document.getElementById("ringTotalPertemuan").innerText = totalPertemuan;

    const kapasitas = totalSiswa * totalPertemuan;
    const rata = kapasitas
      ? ((totalHadir / kapasitas) * 100).toFixed(2)
      : "0.00";
    document.getElementById("ringRataKehadiran").innerText = rata + "%";
  }

  function downloadPDF() {
    const { jsPDF } = window.jspdf;

    const doc = new jsPDF("p", "mm", "a4");
    const pageWidth = doc.internal.pageSize.getWidth();

    const totalSiswa =
      document.getElementById("ringTotalSiswa")?.innerText || "0";
    const totalPertemuan =
      document.getElementById("ringTotalPertemuan")?.innerText || "0";
    const rata =
      document.getElementById("ringRataKehadiran")?.innerText || "0%";

    const title =
      document.getElementById("rekapJudul")?.innerText || "Rekap Kehadiran";
    const sub = document.getElementById("rekapSubJudul")?.innerText || "";

    doc.setFontSize(14);
    doc.setTextColor(0);
    doc.text(title, pageWidth / 2, 14, { align: "center" });

    doc.setFontSize(10);
    doc.text(sub, pageWidth / 2, 20, { align: "center" });

    let yCard = 26;
    const cardW = 55;
    const cardH = 20;
    const gap = 6;
    const startX = (pageWidth - (cardW * 3 + gap * 2)) / 2;

    doc.setDrawColor(180);
    doc.setFillColor(255, 255, 255);
    doc.setTextColor(0);

    function drawCard(x, title, value) {
      doc.rect(x, yCard, cardW, cardH);
      doc.setFontSize(9);
      doc.text(title, x + cardW / 2, yCard + 7, { align: "center" });
      doc.setFontSize(13);
      doc.text(value.toString(), x + cardW / 2, yCard + 15, {
        align: "center",
      });
    }

    drawCard(startX, "Total Siswa", totalSiswa);
    drawCard(startX + cardW + gap, "Total Pertemuan", totalPertemuan);
    drawCard(startX + (cardW + gap) * 2, "Rata-rata Kehadiran", rata);

    const head = [
      [
        "No",
        "Nama Lengkap",
        "Hadir",
        "Sakit",
        "Izin",
        "Alfa",
        "Cabut",
        "% Kehadiran",
      ],
    ];

    const body = [];
    document.querySelectorAll(".rekap-row").forEach((tr) => {
      const row = [];
      tr.querySelectorAll("td").forEach((td) => {
        row.push(td.innerText.trim());
      });
      body.push(row);
    });

    doc.autoTable({
      startY: yCard + cardH + 8,
      head: head,
      body: body,
      theme: "grid",
      styles: {
        fontSize: 8,
        halign: "center",
        valign: "middle",
        cellPadding: 2,
      },
      headStyles: {
        fillColor: [240, 240, 240],
        textColor: 0,
        fontSize: 9,
      },
      columnStyles: {
        0: { cellWidth: 8 },
        1: { cellWidth: 45 },
        2: { cellWidth: 15 },
        3: { cellWidth: 15 },
        4: { cellWidth: 15 },
        5: { cellWidth: 15 },
        6: { cellWidth: 15 },
        7: { cellWidth: 20 },
      },
      didParseCell(data) {
        if (data.column.index === 7) {
          const v = parseFloat(data.cell.raw);
          if (v < 50) data.cell.styles.textColor = [200, 0, 0];
          else if (v < 70) data.cell.styles.textColor = [200, 140, 0];
          else data.cell.styles.textColor = [0, 140, 70];
        }
      },
    });

    const pageH = doc.internal.pageSize.getHeight();
    doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text(
      "diunduh dari tjktsmkn1telukkuantan.web.id",
      pageWidth - 10,
      pageH - 8,
      { align: "right" },
    );

    doc.save("Rekap-Kehadiran-A4-Potrait.pdf");
  }

  function renderEditTable() {
    const bulan = document.getElementById("editBulan").value;
    const tbody = document.getElementById("editTbody");
    tbody.innerHTML = "";

    const sumber =
      bulan === "ALL"
        ? window._rawRows.map((r, i) => ({ row: r, index: i }))
        : window._rawByMonth[bulan] || [];

    sumber.forEach(({ row, index }) => {
      let tr = "<tr>";
      row.forEach((cell, c) => {
        if (c >= 2) {
          tr += `<td>
          <select class="input cellEdit" data-r="${index}" data-c="${c}">
            <option ${cell === "Hadir" ? "selected" : ""}>Hadir</option>
            <option ${cell === "Sakit" ? "selected" : ""}>Sakit</option>
            <option ${cell === "Izin" ? "selected" : ""}>Izin</option>
            <option ${cell === "Alfa" ? "selected" : ""}>Alfa</option>
            <option ${cell === "Cabut" ? "selected" : ""}>Cabut</option>
          </select>
        </td>`;
        } else {
          tr += `<td>${c === 0 ? formatTanggal(cell) : cell}</td>`;
        }
      });
      tr += "</tr>";
      tbody.insertAdjacentHTML("beforeend", tr);
    });
  }
