  /* === DATA MENTAH REKAP KEHADIRAN (untuk Lampiran A) ===
     Dipecah jadi 2 tahap: (1) ambil & kelompokkan data mentah per
     bulan sekali saat form dibuka, (2) hitung ulang totalnya sesuai
     bulan yang dipilih tepat sebelum PDF dicetak — tanpa fetch ulang. */
  async function ambilDataMentahUntukLampiranA(sheet) {
    const d = await getSheetData(sheet, "all");
    const rows = d.values || [];
    if (rows.length < 2) {
      return { headers: [], bulanan: {}, bulanList: [], totalRows: 0 };
    }

    const headers = rows[0].slice(2);
    const bulanan = {}; // nama -> { "tahun-bulan": {hadir,sakit,izin,alfa,cabut,hari:Set} }
    const bulanSet = new Set();

    for (let r = 1; r < rows.length; r++) {
      const row = rows[r];
      const waktu = row[0];
      if (!waktu) continue;
      const tgl = new Date(waktu);
      if (isNaN(tgl.getTime())) continue;

      const bk = `${tgl.getFullYear()}-${tgl.getMonth()}`;
      const hariKey = tgl.toDateString();
      bulanSet.add(bk);

      row.slice(2).forEach((st, i) => {
        const nama = headers[i];
        if (!nama) return;
        if (!bulanan[nama]) bulanan[nama] = {};
        if (!bulanan[nama][bk]) {
          bulanan[nama][bk] = {
            hadir: 0,
            sakit: 0,
            izin: 0,
            alfa: 0,
            cabut: 0,
            hari: new Set(),
          };
        }
        bulanan[nama][bk].hari.add(hariKey);
        const status = (st || "").toString();
        if (status === "Hadir") bulanan[nama][bk].hadir++;
        else if (status === "Sakit") bulanan[nama][bk].sakit++;
        else if (status === "Izin") bulanan[nama][bk].izin++;
        else if (status === "Alfa") bulanan[nama][bk].alfa++;
        else if (status === "Cabut") bulanan[nama][bk].cabut++;
      });
    }

    return {
      headers,
      bulanan,
      bulanList: [...bulanSet].sort(),
      totalRows: rows.length - 1,
    };
  }

  function hitungRekapDariDataMentah(dataMentah, bulanKey) {
    const { headers, bulanan, totalRows } = dataMentah;
    const pilihBulan = bulanKey && bulanKey !== "ALL" ? bulanKey : "ALL";

    let totals, totalPertemuan;

    if (pilihBulan === "ALL") {
      totals = headers.map((nama) => {
        const perBulan = bulanan[nama] || {};
        const agg = { Hadir: 0, Sakit: 0, Izin: 0, Alfa: 0, Cabut: 0 };
        Object.values(perBulan).forEach((b) => {
          agg.Hadir += b.hadir;
          agg.Sakit += b.sakit;
          agg.Izin += b.izin;
          agg.Alfa += b.alfa;
          agg.Cabut += b.cabut;
        });
        return agg;
      });

      const setHariAll = new Set();
      headers.forEach((nama) => {
        const perBulan = bulanan[nama] || {};
        Object.values(perBulan).forEach((b) =>
          b.hari.forEach((h) => setHariAll.add(h)),
        );
      });
      totalPertemuan = setHariAll.size || totalRows;
    } else {
      totals = headers.map((nama) => {
        const b = (bulanan[nama] && bulanan[nama][pilihBulan]) || {
          hadir: 0,
          sakit: 0,
          izin: 0,
          alfa: 0,
          cabut: 0,
        };
        return {
          Hadir: b.hadir,
          Sakit: b.sakit,
          Izin: b.izin,
          Alfa: b.alfa,
          Cabut: b.cabut,
        };
      });

      const setHariBulan = new Set();
      headers.forEach((nama) => {
        const b = bulanan[nama] && bulanan[nama][pilihBulan];
        if (b) b.hari.forEach((h) => setHariBulan.add(h));
      });
      totalPertemuan = setHariBulan.size;
    }

    const totalSiswa = headers.length;
    const totalHadir = totals.reduce((sum, t) => sum + (t.Hadir || 0), 0);
    const kapasitas = totalSiswa * totalPertemuan;
    const rataKehadiran = kapasitas
      ? ((totalHadir / kapasitas) * 100).toFixed(2)
      : "0.00";

    return {
      headers,
      totals,
      sessionCount: totalPertemuan,
      totalPertemuan,
      totalSiswa,
      rataKehadiran,
    };
  }

  async function cetakPdfLaporanWalas(
    sheet,
    namaGuru,
    dataPermasalahan,
    dataKondisiKelas,
    dataMutasi,
    bulanKey,
  ) {
    showLoading("Menyiapkan Lampiran A (Rekap Kehadiran)...");
    const dataMentah =
      window._dataMentahLampiranA ||
      (await ambilDataMentahUntukLampiranA(sheet));
    const rekap = hitungRekapDariDataMentah(dataMentah, bulanKey || "ALL");

    const namaBulanTerpilih =
      bulanKey && bulanKey !== "ALL"
        ? (() => {
            const [thn, bln] = bulanKey.split("-").map(Number);
            return new Date(thn, bln, 1).toLocaleDateString("id-ID", {
              month: "long",
              year: "numeric",
            });
          })()
        : "Semua Bulan";

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF("p", "mm", "a4");
    const pageWidth = doc.internal.pageSize.getWidth();
    const jumlahSiswa = (window._rosterAktif || []).length;
    const tanggalCetak = new Date().toLocaleDateString("id-ID", {
      day: "2-digit",
      month: "long",
      year: "numeric",
    });

    // === KOP / COVER ===
    const logoEl = document.getElementById("logoSekolahEl");
    let y = 14;
    if (logoEl && logoEl.complete && logoEl.naturalWidth > 0) {
      try {
        doc.addImage(logoEl, "PNG", (pageWidth - 20) / 2, 8, 20, 20);
        y = 8 + 20 + 6;
      } catch (e) {
        // lanjut tanpa logo kalau gagal ditempel
      }
    }

    doc.setFontSize(14);
    doc.setFont(undefined, "bold");
    doc.text("SMKN 1 TELUK KUANTAN", pageWidth / 2, y, { align: "center" });
    doc.setFontSize(12);
    doc.text("LAPORAN GURU WALI KELAS", pageWidth / 2, y + 6, {
      align: "center",
    });
    doc.setFont(undefined, "normal");

    y += 16;
    doc.setDrawColor(0);
    doc.setLineWidth(0.5);
    doc.line(15, y, pageWidth - 15, y);
    y += 8;

    // === A. IDENTITAS ===
    doc.setFontSize(10);
    const identitas = [
      ["Nama Wali Kelas", namaGuru || "-"],
      ["Kelas", sheet],
      ["Jumlah Siswa", String(jumlahSiswa)],
      ["Tanggal Cetak", tanggalCetak],
    ];
    identitas.forEach(([label, value], i) => {
      const yy = y + i * 6;
      doc.text(label, 15, yy);
      doc.text(":", 60, yy);
      doc.text(String(value), 64, yy);
    });
    y += identitas.length * 6 + 10;

    // === LAMPIRAN A. REKAP KEHADIRAN SISWA (model tabel sama seperti
    // PDF Rekap Kehadiran yang sudah ada) ===
    doc.setFontSize(11);
    doc.setFont(undefined, "bold");
    doc.text("LAMPIRAN A. REKAP KEHADIRAN SISWA", 15, y);
    doc.setFont(undefined, "normal");
    doc.setFontSize(9);
    doc.setTextColor(100);
    doc.text(`Periode: ${namaBulanTerpilih}`, 15, y + 5);
    doc.setTextColor(0);
    y += 10;

    // === 3 KARTU RINGKASAN (Total Siswa / Total Pertemuan / Rata-rata) ===
    {
      const cardW = 55;
      const cardH = 18;
      const gap = 6;
      const startX = (pageWidth - (cardW * 3 + gap * 2)) / 2;
      doc.setDrawColor(180);
      doc.setFillColor(255, 255, 255);

      function drawCardLampiranA(x, judul, nilai) {
        doc.rect(x, y, cardW, cardH);
        doc.setFontSize(8.5);
        doc.text(judul, x + cardW / 2, y + 6.5, { align: "center" });
        doc.setFontSize(12);
        doc.text(String(nilai), x + cardW / 2, y + 13.5, { align: "center" });
      }

      drawCardLampiranA(startX, "Total Siswa", rekap.totalSiswa);
      drawCardLampiranA(
        startX + cardW + gap,
        "Total Pertemuan",
        rekap.totalPertemuan,
      );
      drawCardLampiranA(
        startX + (cardW + gap) * 2,
        "Rata-rata Kehadiran",
        rekap.rataKehadiran + "%",
      );
      y += cardH + 10;
    }

    const bodyA =
      rekap.headers.length > 0
        ? rekap.headers.map((name, i) => {
            const t = rekap.totals[i];
            const hadir = t.Hadir || 0;
            const persen =
              rekap.sessionCount > 0
                ? ((hadir / rekap.sessionCount) * 100).toFixed(2)
                : "0.00";
            return [
              i + 1,
              name,
              hadir,
              t.Sakit || 0,
              t.Izin || 0,
              t.Alfa || 0,
              t.Cabut || 0,
              persen + "%",
            ];
          })
        : [["-", "Belum ada data presensi", "-", "-", "-", "-", "-", "-"]];

    doc.autoTable({
      startY: y + 4,
      head: [
        [
          "No",
          "Nama Lengkap",
          "Hadir",
          "Sakit",
          "Izin",
          "Alfa",
          "Cabut",
          "% Kehadiran",
        ],
      ],
      body: bodyA,
      theme: "grid",
      styles: {
        fontSize: 8,
        halign: "center",
        valign: "middle",
        cellPadding: 2,
      },
      headStyles: {
        fillColor: [37, 99, 235],
        textColor: 255,
        fontSize: 9,
        halign: "center",
      },
      columnStyles: {
        0: { cellWidth: 8 },
        1: { cellWidth: 45 },
        2: { cellWidth: 15 },
        3: { cellWidth: 15 },
        4: { cellWidth: 15 },
        5: { cellWidth: 15 },
        6: { cellWidth: 15 },
        7: { cellWidth: 20 },
      },
      didParseCell(data) {
        if (data.column.index === 7 && data.section === "body") {
          const v = parseFloat(data.cell.raw);
          if (v < 50) data.cell.styles.textColor = [200, 0, 0];
          else if (v < 70) data.cell.styles.textColor = [200, 140, 0];
          else data.cell.styles.textColor = [0, 140, 70];
        }
      },
      margin: { left: 15, right: 15 },
    });
    y = doc.lastAutoTable.finalY + 12;

    if (y > 250) {
      doc.addPage();
      y = 20;
    }

    // === LAMPIRAN B. PERMASALAHAN SISWA ===
    doc.setFontSize(11);
    doc.setFont(undefined, "bold");
    doc.text("LAMPIRAN B. PERMASALAHAN SISWA", 15, y);
    doc.setFont(undefined, "normal");

    // Generate QR code untuk tiap baris yang punya foto (barcode foto,
    // mirip fitur Jurnal Guru Wali di sistem MAGANG). Harus selesai
    // dulu sebelum autoTable digambar karena didDrawCell sinkron.
    const adaFotoUntukDiCetak = dataPermasalahan.some((it) => it.fotoUrl);
    if (adaFotoUntukDiCetak && !window.QRCode) {
      alert(
        "⚠️ Library QR Code gagal dimuat (mungkin koneksi internet lambat/terblokir), jadi kolom Barcode Foto akan kosong di PDF ini. Coba refresh halaman lalu cetak ulang.",
      );
    }

    const qrFotoB = [];
    for (const it of dataPermasalahan) {
      if (it.fotoUrl && window.QRCode) {
        try {
          qrFotoB.push(
            await QRCode.toDataURL(it.fotoUrl, { width: 120, margin: 1 }),
          );
        } catch (e) {
          console.error("Gagal generate QR untuk", it.fotoUrl, e);
          qrFotoB.push(null);
        }
      } else {
        qrFotoB.push(null);
      }
    }

    const bodyB =
      dataPermasalahan.length > 0
        ? dataPermasalahan.map((it, i) => [
            i + 1,
            it.namaSiswa,
            it.proses || "-",
            it.keterangan || "-",
            "",
          ])
        : [["-", "-", "-", "-", ""]];

    doc.autoTable({
      startY: y + 4,
      head: [
        [
          "No",
          "Nama Siswa",
          "Proses Penyelesaian",
          "Keterangan",
          "Barcode Foto",
        ],
      ],
      body: bodyB,
      theme: "grid",
      styles: { fontSize: 9, cellPadding: 2.5, minCellHeight: 20 },
      headStyles: {
        fillColor: [37, 99, 235],
        textColor: 255,
        halign: "center",
      },
      columnStyles: {
        0: { cellWidth: 10, halign: "center" },
        1: { cellWidth: 40 },
        4: { cellWidth: 22, halign: "center" },
      },
      margin: { left: 15, right: 15 },
      didDrawCell: (data) => {
        if (data.section === "body" && data.column.index === 4) {
          const qr = qrFotoB[data.row.index];
          if (qr) {
            const ukuran = Math.min(data.cell.width, data.cell.height) - 4;
            doc.addImage(
              qr,
              "PNG",
              data.cell.x + (data.cell.width - ukuran) / 2,
              data.cell.y + (data.cell.height - ukuran) / 2,
              ukuran,
              ukuran,
            );
          }
        }
      },
    });
    y = doc.lastAutoTable.finalY + 12;

    if (y > 250) {
      doc.addPage();
      y = 20;
    }

    // === C. KONDISI KELAS ===
    doc.setFontSize(11);
    doc.setFont(undefined, "bold");
    doc.text("LAMPIRAN C. KONDISI KELAS", 15, y);
    doc.setFont(undefined, "normal");

    const bodyC =
      dataKondisiKelas.length > 0
        ? dataKondisiKelas.map((it, i) => [
            i + 1,
            it.piket || "-",
            it.inventaris || "-",
            it.keterangan || "-",
          ])
        : [["-", "-", "-", "-"]];

    doc.autoTable({
      startY: y + 4,
      head: [["No", "Pelaksanaan Piket", "Inventaris Kelas", "Keterangan"]],
      body: bodyC,
      theme: "grid",
      styles: { fontSize: 9, cellPadding: 2.5 },
      headStyles: {
        fillColor: [37, 99, 235],
        textColor: 255,
        halign: "center",
      },
      columnStyles: { 0: { cellWidth: 10, halign: "center" } },
      margin: { left: 15, right: 15 },
    });
    y = doc.lastAutoTable.finalY + 12;

    if (y > 250) {
      doc.addPage();
      y = 20;
    }

    // === D. MUTASI SISWA ===
    doc.setFontSize(11);
    doc.setFont(undefined, "bold");
    doc.text("LAMPIRAN D. MUTASI SISWA", 15, y);
    doc.setFont(undefined, "normal");

    const bodyD =
      dataMutasi.length > 0
        ? dataMutasi.map((it, i) => [
            i + 1,
            it.namaSiswa,
            it.jenis || "-",
            it.keterangan || "-",
            it.tanggal ? formatTanggal(it.tanggal) : "-",
          ])
        : [["-", "-", "-", "-", "-"]];

    doc.autoTable({
      startY: y + 4,
      head: [["No", "Nama Siswa", "Jenis Mutasi", "Keterangan", "Tanggal"]],
      body: bodyD,
      theme: "grid",
      styles: { fontSize: 9, cellPadding: 2.5 },
      headStyles: {
        fillColor: [37, 99, 235],
        textColor: 255,
        halign: "center",
      },
      columnStyles: { 0: { cellWidth: 10, halign: "center" } },
      margin: { left: 15, right: 15 },
    });
    y = doc.lastAutoTable.finalY + 24;

    // === TANDA TANGAN ===
    if (y > 260) {
      doc.addPage();
      y = 30;
    }
    doc.setFontSize(10);
    doc.text(`Teluk Kuantan, ${tanggalCetak}`, pageWidth - 70, y);
    doc.text("Guru Wali Kelas,", pageWidth - 70, y + 6);
    doc.text(namaGuru || "___________________", pageWidth - 70, y + 28);
    doc.setLineWidth(0.3);
    doc.line(pageWidth - 70, y + 29, pageWidth - 15, y + 29);

    const pageH = doc.internal.pageSize.getHeight();
    doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text(
      "diunduh dari tjktsmkn1telukkuantan.web.id",
      pageWidth - 10,
      pageH - 8,
      { align: "right" },
    );

    doc.save(`Laporan-Walas-${sheet}.pdf`);
    closeOverlay();
  }

  /* === FORMAT TIMESTAMP → DD/MM/YYYY === */
  function formatTanggal(value) {
    const d = new Date(value);
    if (isNaN(d)) return value;
    const dd = d.getDate().toString().padStart(2, "0");
    const mm = (d.getMonth() + 1).toString().padStart(2, "0");
    const yyyy = d.getFullYear();
    return `${dd}/${mm}/${yyyy}`;
  }

  /*simpan*/
  async function saveEditedRaw(sheet) {
    try {
      const edits = [...document.querySelectorAll(".cellEdit")].map((el) => ({
        rowIndex: parseInt(el.dataset.r) + 2,
        colIndex: parseInt(el.dataset.c) + 1,
        value: el.value,
      }));

      const barisBaruEls = [
        ...document.querySelectorAll("#editTbody tr[data-baris-baru]"),
      ];

      if (edits.length === 0 && barisBaruEls.length === 0) {
        return alert("Tidak ada perubahan untuk disimpan.");
      }

      if (!confirm("Simpan semua perubahan ke Google Sheet?")) return;

      showLoading(
        "Menyimpan perubahan...",
        "Mengirim perubahan baris ke Google Sheets...",
      );

      if (edits.length > 0) {
        const j = await postToAppsScript({
          action: "editRawData",
          kelas: sheet,
          edits,
        });
        if (!j.ok) {
          hideLoading();
          alert(
            "❌ Gagal simpan perubahan sel: " + (j.error || "Tidak diketahui"),
          );
          return;
        }
      }

      if (barisBaruEls.length > 0 && !adminPasswordAktif) {
        hideLoading();
        alert(
          "⚠️ Sesi Login Walas tidak ditemukan, baris baru GAGAL disimpan. Perubahan sel di atas (kalau ada) sudah tersimpan.",
        );
        return;
      }

      for (const tr of barisBaruEls) {
        const tanggal = tr.dataset.tanggalBaru;
        const statusPerSiswa = {};
        tr.querySelectorAll(".cellEditBaru").forEach((sel) => {
          statusPerSiswa[sel.dataset.nama] = sel.value;
        });

        const j2 = await postToAppsScript({
          action: "tambahBarisPresensiManual",
          kelas: sheet,
          adminPassword: adminPasswordAktif,
          tanggal,
          statusPerSiswa,
        });
        if (!j2.ok) {
          hideLoading();
          alert(
            `❌ Gagal tambah baris tanggal ${tanggal}: ` +
              (j2.error || "Tidak diketahui"),
          );
          return;
        }
      }

      invalidateSheetCache(sheet);
      await finishProgress("Perubahan Tersimpan 100%!");
      alert("✅ Data berhasil diperbarui");
      openAdminModal(sheet, true);
    } catch (err) {
      hideLoading();
      alert("❌ Gagal menyimpan perubahan: " + (err.message || err));
    }
  }

  function tambahBarisTanggalBaru() {

    let setHariBulan = new Set();
    let totalSiswa = 0;

    let totalPertemuan = 0;

    updateJudulRekap(bulanKey);

      if (bulanKey === "ALL") {

        row.querySelector(".col-izin").innerText = row.dataset.izin;
        row.querySelector(".col-alfa").innerText = row.dataset.alfa;
        row.querySelector(".col-cabut").innerText = row.dataset.cabut;

        const td = row.querySelector(".col-persen");
        const persenNum = parseFloat(row.dataset.persen);

        td.innerText = persenNum.toFixed(2) + "%";

        td.classList.remove("persen-merah", "persen-kuning", "persen-hijau");

        if (persenNum < 50) td.classList.add("persen-merah");
        else if (persenNum < 70) td.classList.add("persen-kuning");
        else td.classList.add("persen-hijau");

        totalSiswa++;
        totalHadir += parseInt(row.dataset.hadir || 0);
        return;
      }

      const r = window._bulanan?.[nama]?.[bulanKey];
      if (!r) {
        row.querySelector(".col-hadir").innerText = "0";
        row.querySelector(".col-sakit").innerText = "0";
        row.querySelector(".col-izin").innerText = "0";
        row.querySelector(".col-alfa").innerText = "0";
        row.querySelector(".col-cabut").innerText = "0";
        row.querySelector(".col-persen").innerText = "0%";
        return;
      }

      if (r) {
        totalSiswa++;
        totalHadir += r.hadir;
        r.hari.forEach((h) => {
          setHariBulan.add(h);
        });
      }

      row.querySelector(".col-hadir").innerText = r.hadir;
      row.querySelector(".col-sakit").innerText = r.sakit;
      row.querySelector(".col-izin").innerText = r.izin;
      row.querySelector(".col-alfa").innerText = r.alfa;
      row.querySelector(".col-cabut").innerText = r.cabut;

      const total = r.hari.size;
      const persenNum = total ? (r.hadir / total) * 100 : 0;

      const td = row.querySelector(".col-persen");

      td.classList.remove("persen-merah", "persen-kuning", "persen-hijau");

      if (persenNum < 50) {
        td.classList.add("persen-merah");
      } else if (persenNum < 70) {
        td.classList.add("persen-kuning");
      } else {
        td.classList.add("persen-hijau");
      }

      td.innerText = persenNum.toFixed(2) + "%";
    });

    if (bulanKey === "ALL") {
      totalPertemuan = hitungTotalPertemuanAll();
    } else {
      totalPertemuan = setHariBulan.size;
    }

    document.getElementById("ringTotalSiswa").innerText = totalSiswa;
    document.getElementById("ringTotalPertemuan").innerText = totalPertemuan;

    const kapasitas = totalSiswa * totalPertemuan;
    const rata = kapasitas
      ? ((totalHadir / kapasitas) * 100).toFixed(2)
      : "0.00";
    document.getElementById("ringRataKehadiran").innerText = rata + "%";
  }

  /* === Bersihkan emoji sebelum dikirim ke jsPDF ===
     Font default jsPDF (WinAnsiEncoding) tidak mendukung emoji —
     kalau dibiarkan, hasilnya karakter rusak semacam "Ø=ÜÊ" di PDF.
     Emoji aman dipakai di tampilan HTML biasa, jadi fungsi ini HANYA
     dipakai tepat sebelum teks masuk ke doc.text()/autoTable(). */
  function bersihkanEmojiUntukPDF(teks) {
    return String(teks || "")
      .replace(
        /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\uFE0F]/gu,
        "",
      )
      .replace(/\s{2,}/g, " ")
      .trim();
  }

    // === 3 KARTU RINGKASAN (PERSIS LOGIN WALAS) ===

    // === TABEL KEHADIRAN SISWA DENGAN TEMA ROYAL BLUE (PERSIS LOGIN WALAS) ===

        "Cabut",

      tr.querySelectorAll("td").forEach((td) => {
        row.push(td.innerText.trim());
      });
      if (row.length > 0) body.push(row);
    });

    doc.autoTable({
      startY: y,
      head: head,
      body:
        body.length > 0
          ? body
          : [["-", "Belum ada data presensi", "-", "-", "-", "-", "-", "-"]],
      theme: "grid",
      styles: {
        fontSize: 8,
        halign: "center",
        valign: "middle",
        cellPadding: 2,
      },
      headStyles: {
        fillColor: [37, 99, 235],
        textColor: 255,
        fontSize: 9,
        halign: "center",
        fontStyle: "bold",
      },
      columnStyles: {
        0: { cellWidth: 8, halign: "center" },
        1: { cellWidth: 45, halign: "left" },
        2: { cellWidth: 15, halign: "center" },
        3: { cellWidth: 15, halign: "center" },
        4: { cellWidth: 15, halign: "center" },
        5: { cellWidth: 15, halign: "center" },
        6: { cellWidth: 15, halign: "center" },
        7: { cellWidth: 20, halign: "center" },
      },
      didParseCell(data) {
        if (data.column.index === 7 && data.section === "body") {
          const v = parseFloat(data.cell.raw);
          if (v < 50) data.cell.styles.textColor = [200, 0, 0];
          else if (v < 70) data.cell.styles.textColor = [200, 140, 0];
          else data.cell.styles.textColor = [0, 140, 70];
        }
      },
      margin: { left: 15, right: 15 },
    });

    y = doc.lastAutoTable.finalY + 16;
    if (y > 245) {
      doc.addPage();
      y = 25;
    }

    // === TANDA TANGAN RESMI GURU WALI KELAS (PERSIS LOGIN WALAS) ===
    doc.setFontSize(10);
    doc.setTextColor(0);

    doc.setLineWidth(0.3);
    doc.line(pageWidth - 70, y + 29, pageWidth - 15, y + 29);

    // === FOOTER NOTE ===
    const pageH = doc.internal.pageSize.getHeight();
    doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text(
      "diunduh dari portalsmkn1telku.vercel.app",
      pageWidth - 15,
      pageH - 8,
      { align: "right" },
    );

    const namaFileBulan = bersihkanEmojiUntukPDF(periodeBulan).replace(
      /[^a-zA-Z0-9]/g,
      "_",
    );
    doc.save(`Rekap-Kehadiran-${sheet}-${namaFileBulan}.pdf`);
  }

  /* === CETAK DATA MENTAH PRESENSI FORMAT A4 LANDSCAPE (AKOMODIR BANYAK BULAN & BANYAK SISWA) === */
  async function downloadDataMentahPDF(sheet) {
    const { jsPDF } = window.jspdf || {};
    if (!jsPDF) {
      return alert("Pustaka jsPDF belum dimuat. Silakan muat ulang halaman.");
    }

    const kelasAktif =
      sheet ||
      window.currentSheet ||
      document.getElementById("kelasSelect")?.value ||
      "Kelas";

    showLoading(
      "Mempersiapkan PDF Data Mentah...",
      `Mengambil & menyusun data presensi kelas ${kelasAktif}...`,
    );

    try {
      // 1. Ambil data lengkap
      let d = null;
      if (
        window._rawHeaders &&
        window._rawHeaders.length > 2 &&
        window._rawRows &&
        window.currentSheet === kelasAktif
      ) {
        d = {
          values: [window._rawHeaders, ...window._rawRows],
          namaGuru:
            window._namaGuruAktif ||
            document.getElementById("namaGuruWalas")?.value ||
            "",
        };
      } else {
        d = await getSheetData(kelasAktif, "all");
      }

      const rows = (d && d.values) || [];
      if (rows.length < 2) {
        hideLoading();
        return alert(
          "Belum ada data presensi mentah untuk dicetak pada kelas ini.",
        );
      }

      const rawHeaders = rows[0] || [];
      // Kolom nama siswa (kolom index 2 ke atas)
      const daftarSiswa = rawHeaders
        .slice(2)
        .map((s) => bersihkanEmojiUntukPDF(String(s).trim()))
        .filter(Boolean);

      if (daftarSiswa.length === 0) {
        hideLoading();
        return alert("Daftar nama siswa kosong.");
      }

      // 2. Deteksi filter bulan aktif dari UI (Login Walas #editBulan atau Rekap #filterBulan)
      const editBulanEl = document.getElementById("editBulan");
      const filterBulanEl = document.getElementById("filterBulan");
      const activeBulanVal =
        (editBulanEl ? editBulanEl.value : null) ||
        (filterBulanEl ? filterBulanEl.value : null) ||
        "ALL";

      const NAMA_BULAN = [
        "Januari",
        "Februari",
        "Maret",
        "April",
        "Mei",
        "Juni",
        "Juli",
        "Agustus",
        "September",
        "Oktober",
        "November",
        "Desember",
      ];

      // 3. Kelompokkan data per bulan ("YYYY-M")
      const rawDataRows = rows.slice(1).filter((r) => r && r[0]);
      const rowsByMonth = {};
      const fallbackRows = [];

      rawDataRows.forEach((r) => {
        const dt = new Date(r[0]);
        if (!isNaN(dt.getTime())) {
          const mKey = `${dt.getFullYear()}-${dt.getMonth()}`;
          if (!rowsByMonth[mKey]) rowsByMonth[mKey] = [];
          rowsByMonth[mKey].push(r);
        } else {
          fallbackRows.push(r);
        }
      });

      // Urutkan kunci bulan secara kronologis (misal: Juli -> Agustus -> September...)
      const sortedMonthKeys = Object.keys(rowsByMonth).sort((a, b) => {
        const [y1, m1] = a.split("-").map(Number);
        const [y2, m2] = b.split("-").map(Number);
        return y1 === y2 ? m1 - m2 : y1 - y2;
      });

      // Tentukan bulan mana saja yang akan dicetak
      let targetMonthKeys = [];
      let isSingleMonth = false;

      if (activeBulanVal !== "ALL") {
        if (rowsByMonth[activeBulanVal]) {
          targetMonthKeys = [activeBulanVal];
          isSingleMonth = true;
        } else {
          hideLoading();
          return alert("Tidak ada data presensi pada bulan yang dipilih.");
        }
      } else {
        targetMonthKeys = sortedMonthKeys;
        if (targetMonthKeys.length === 0 && fallbackRows.length > 0) {
          targetMonthKeys = ["ALL"];
          rowsByMonth["ALL"] = fallbackRows;
        }
      }

      if (targetMonthKeys.length === 0) {
        hideLoading();
        return alert("Tidak ada data pertemuan presensi yang dapat dicetak.");
      }

      const namaGuru = bersihkanEmojiUntukPDF(
        d.namaGuru ||
          window._namaGuruAktif ||
          document.getElementById("namaGuruWalas")?.value ||
          "-",
      );

      const tanggalCetak = new Date().toLocaleDateString("id-ID", {
        day: "2-digit",
        month: "long",
        year: "numeric",
      });

      // 4. Inisialisasi dokumen jsPDF A4 Landscape (297 mm x 210 mm)
      const doc = new jsPDF("landscape", "mm", "a4");
      const pageWidth = doc.internal.pageSize.getWidth(); // 297 mm
      const pageHeight = doc.internal.pageSize.getHeight(); // 210 mm
      const logoEl = document.getElementById("logoSekolahEl");

      // Ukuran adaptif untuk mengakomodir banyak siswa
      const totalSiswa = daftarSiswa.length;
      const isBanyakSiswa = totalSiswa > 33;
      const baseFontSize = isBanyakSiswa ? 6.3 : 6.8;
      const baseCellPadding = isBanyakSiswa ? 0.75 : 0.95;

      let isFirstPageOverall = true;

      // Helper function menggambar Kop & Header halaman
      function drawKopLandscape(docRef, judulPeriode, infoBagian = "") {
        let yPos = 8;
        if (logoEl && logoEl.complete && logoEl.naturalWidth > 0) {
          try {
            docRef.addImage(logoEl, "PNG", 10, yPos, 14, 14);
          } catch (e) {}
        }

        docRef.setFontSize(12.5);
        docRef.setFont(undefined, "bold");
        docRef.setTextColor(15, 23, 42);
        docRef.text("SMKN 1 TELUK KUANTAN", 28, yPos + 4.5);

        docRef.setFontSize(9.5);
        docRef.text(
          "LAPORAN DATA MENTAH PRESENSI SISWA (JURNAL HARIAN)",
          28,
          yPos + 9.5,
        );

        docRef.setFont(undefined, "normal");
        docRef.setFontSize(7.5);
        docRef.setTextColor(100);
        const subInfo = infoBagian ? ` — ${infoBagian}` : "";
        docRef.text(
          `Tahun Ajaran 2026/2027 • Format Lembar Kerja A4 Landscape${subInfo}`,
          28,
          yPos + 13.5,
        );

        yPos += 16;
        docRef.setDrawColor(203, 213, 225);
        docRef.setLineWidth(0.4);
        docRef.line(10, yPos, pageWidth - 10, yPos);
        yPos += 3;

        // 4 Kolom Identitas Rapi
        docRef.setFontSize(8);
        docRef.setTextColor(30, 41, 59);

        const col1X = 10;
        const col2X = 80;
        const col3X = 150;
        const col4X = 220;

        docRef.text("Kelas", col1X, yPos + 3);
        docRef.text(`:  ${kelasAktif}`, col1X + 18, yPos + 3);

        docRef.text("Guru Wali kelas", col2X, yPos + 3);
        docRef.text(`:  ${namaGuru || "-"}`, col2X + 20, yPos + 3);

        docRef.text("Periode", col3X, yPos + 3);
        docRef.text(`:  ${judulPeriode}`, col3X + 18, yPos + 3);

        docRef.text("Tgl Cetak", col4X, yPos + 3);
        docRef.text(`:  ${tanggalCetak}`, col4X + 20, yPos + 3);

        return yPos + 7;
      }

      // Helper function menggambar Blok Tanda Tangan Resmi
      function drawSignatureBlock(docRef, startYPos) {
        const sigHeightNeeded = 26;
        let finalY = startYPos;
        if (finalY + sigHeightNeeded > pageHeight - 8) {
          docRef.addPage("a4", "landscape");
          finalY = 22;
        } else {
          finalY = Math.max(finalY + 6, pageHeight - 24);
        }

        docRef.setFontSize(7.8);
        docRef.setTextColor(30, 41, 59);

        // Kiri: Mengetahui Kepala Sekolah
        const leftSigX = 18;
        docRef.text("Mengetahui,", leftSigX, finalY - 12);
        docRef.text("Kepala SMKN 1 Teluk Kuantan", leftSigX, finalY - 8.5);
        docRef.setFont(undefined, "bold");
        docRef.text("HURDISMAN, S.Pd", leftSigX, finalY);
        docRef.setFont(undefined, "normal");
        docRef.setFontSize(7);
        docRef.text("NIP. 19690804 199412 1 002", leftSigX, finalY + 3.5);

        // Kanan: Guru Wali Kelas
        const rightSigX = pageWidth - 65;
        docRef.setFontSize(7.8);
        docRef.text(`Teluk Kuantan, ${tanggalCetak}`, rightSigX, finalY - 12);
        docRef.text(`Guru Wali Kelas ${kelasAktif}`, rightSigX, finalY - 8.5);
        docRef.setFont(undefined, "bold");
        docRef.text(
          namaGuru || "( .................................... )",
          rightSigX,
          finalY,
        );
        docRef.setFont(undefined, "normal");
        docRef.setFontSize(7);
        docRef.text("NIP. -", rightSigX, finalY + 3.5);
      }

      // 5. PROSES PER BULAN (Setiap bulan mendapatkan halaman tersendiri yang tersusun rapi)
      targetMonthKeys.forEach((mKey) => {
        const monthRows = rowsByMonth[mKey] || [];
        if (monthRows.length === 0) return;

        // Urutkan tanggal pada bulan ini dari terlama ke terbaru
        monthRows.sort((a, b) => {
          const ta = new Date(a[0]).getTime();
          const tb = new Date(b[0]).getTime();
          if (isNaN(ta) || isNaN(tb)) return 0;
          return ta - tb;
        });

        let labelBulan = "Semua Pertemuan";
        if (mKey !== "ALL") {
          const [thn, bln] = mKey.split("-").map(Number);
          labelBulan = `Bulan ${NAMA_BULAN[bln] || ""} ${thn}`;
        }

        // Jika tanggal dalam satu bulan > 22 hari, chunk per 20 hari agar tidak gepeng
        const maxDatesPerTable = 20;
        const monthChunks = [];
        for (let i = 0; i < monthRows.length; i += maxDatesPerTable) {
          monthChunks.push(monthRows.slice(i, i + maxDatesPerTable));
        }

        // Hitung akumulasi kehadiran per siswa untuk bulan ini
        const totalPertemuanBulan = monthRows.length;
        const ringkasanBulan = daftarSiswa.map((_, sIdx) => {
          let h = 0,
            s = 0,
            i = 0,
            a = 0,
            c = 0;
          monthRows.forEach((row) => {
            const st = String(row[sIdx + 2] || "")
              .trim()
              .toLowerCase();
            if (st === "hadir" || st === "h") h++;
            else if (st === "sakit" || st === "s") s++;
            else if (st === "izin" || st === "i") i++;
            else if (st === "alfa" || st === "a") a++;
            else if (st === "cabut" || st === "c") c++;
          });
          const persentase =
            totalPertemuanBulan > 0
              ? ((h / totalPertemuanBulan) * 100).toFixed(0) + "%"
              : "0%";
          return { h, s, i, a, c, persentase };
        });

        monthChunks.forEach((chunkRows, chunkIdx) => {
          if (!isFirstPageOverall) {
            doc.addPage("a4", "landscape");
          }
          isFirstPageOverall = false;

          const infoBagian =
            monthChunks.length > 1
              ? `Bagian ${chunkIdx + 1} dari ${monthChunks.length}`
              : "";
          const startTableY = drawKopLandscape(doc, labelBulan, infoBagian);

          // Susun Table Header
          const tableHead = ["No", "Nama Siswa"];
          chunkRows.forEach((row) => {
            const dt = new Date(row[0]);
            if (!isNaN(dt.getTime())) {
              const dStr = String(dt.getDate()).padStart(2, "0");
              const mStr = String(dt.getMonth() + 1).padStart(2, "0");
              tableHead.push(`${dStr}/${mStr}`);
            } else {
              tableHead.push(String(row[0]).slice(0, 5));
            }
          });

          const isLastChunkOfMonth = chunkIdx === monthChunks.length - 1;
          if (isLastChunkOfMonth) {
            tableHead.push("H", "S", "I", "A", "C", "%");
          }

          // Susun Table Body
          const tableBody = [];
          daftarSiswa.forEach((namaSiswa, sIdx) => {
            const rowData = [String(sIdx + 1), namaSiswa];

            chunkRows.forEach((row) => {
              const val = String(row[sIdx + 2] || "").trim();
              let kode = "-";
              const lower = val.toLowerCase();
              if (lower === "hadir" || lower === "h") kode = "H";
              else if (lower === "sakit" || lower === "s") kode = "S";
              else if (lower === "izin" || lower === "i") kode = "I";
              else if (lower === "alfa" || lower === "a") kode = "A";
              else if (lower === "cabut" || lower === "c") kode = "C";
              rowData.push(kode);
            });

            if (isLastChunkOfMonth) {
              const r = ringkasanBulan[sIdx];
              rowData.push(
                String(r.h),
                String(r.s),
                String(r.i),
                String(r.a),
                String(r.c),
                r.persentase,
              );
            }

            tableBody.push(rowData);
          });

          // Baris Total Hadir Harian per Tanggal
          const totalHarianRow = ["", "Total Hadir"];
          chunkRows.forEach((row) => {
            let countHadir = 0;
            daftarSiswa.forEach((_, sIdx) => {
              const val = String(row[sIdx + 2] || "")
                .trim()
                .toLowerCase();
              if (val === "hadir" || val === "h") countHadir++;
            });
            totalHarianRow.push(String(countHadir));
          });

          if (isLastChunkOfMonth) {
            const grandH = ringkasanBulan.reduce((sum, x) => sum + x.h, 0);
            const grandS = ringkasanBulan.reduce((sum, x) => sum + x.s, 0);
            const grandI = ringkasanBulan.reduce((sum, x) => sum + x.i, 0);
            const grandA = ringkasanBulan.reduce((sum, x) => sum + x.a, 0);
            const grandC = ringkasanBulan.reduce((sum, x) => sum + x.c, 0);
            const grandKap = totalSiswa * totalPertemuanBulan;
            const grandRata =
              grandKap > 0
                ? ((grandH / grandKap) * 100).toFixed(0) + "%"
                : "0%";
            totalHarianRow.push(
              String(grandH),
              String(grandS),
              String(grandI),
              String(grandA),
              String(grandC),
              grandRata,
            );
          }
          tableBody.push(totalHarianRow);

          // Lebar kolom responsif
          const colStyles = {
            0: { cellWidth: 7, halign: "center" },
            1: { cellWidth: 50, halign: "left", fontStyle: "bold" },
          };

          const dateColStartIndex = 2;
          const dateColEndIndex = dateColStartIndex + chunkRows.length;
          for (let c = dateColStartIndex; c < dateColEndIndex; c++) {
            colStyles[c] = { halign: "center" };
          }

          if (isLastChunkOfMonth) {
            colStyles[dateColEndIndex] = { cellWidth: 5.8, halign: "center" }; // H
            colStyles[dateColEndIndex + 1] = {
              cellWidth: 5.8,
              halign: "center",
            }; // S
            colStyles[dateColEndIndex + 2] = {
              cellWidth: 5.8,
              halign: "center",
            }; // I
            colStyles[dateColEndIndex + 3] = {
              cellWidth: 5.8,
              halign: "center",
            }; // A
            colStyles[dateColEndIndex + 4] = {
              cellWidth: 5.8,
              halign: "center",
            }; // C
            colStyles[dateColEndIndex + 5] = {
              cellWidth: 9,
              halign: "center",
              fontStyle: "bold",
            }; // %
          }

          doc.autoTable({
            startY: startTableY,
            head: [tableHead],
            body: tableBody,
            theme: "grid",
            styles: {
              fontSize: baseFontSize,
              cellPadding: baseCellPadding,
              lineColor: [226, 232, 240],
              lineWidth: 0.15,
              valign: "middle",
              overflow: "ellipsize",
            },
            headStyles: {
              fillColor: [37, 99, 235], // Royal Blue
              textColor: [255, 255, 255],
              fontStyle: "bold",
              halign: "center",
              fontSize: baseFontSize + 0.3,
            },
            columnStyles: colStyles,
            showHead: "everyPage",
            margin: { left: 10, right: 10, top: 10, bottom: 25 },
            didParseCell: function (data) {
              if (data.section === "head") {
                if (data.column.index === 1) data.cell.styles.halign = "left";
                return;
              }

              // Baris Total Hadir (paling bawah)
              if (data.row.index === tableBody.length - 1) {
                data.cell.styles.fillColor = [241, 245, 249];
                data.cell.styles.fontStyle = "bold";
                data.cell.styles.textColor = [30, 41, 59];
                return;
              }

              // Pewarnaan status presensi
              const val = String(data.cell.raw || "").trim();
              if (val === "H") {
                data.cell.styles.textColor = [22, 101, 52];
                data.cell.styles.fontStyle = "bold";
              } else if (val === "S") {
                data.cell.styles.textColor = [29, 78, 216];
                data.cell.styles.fontStyle = "bold";
              } else if (val === "I") {
                data.cell.styles.textColor = [180, 83, 9];
                data.cell.styles.fontStyle = "bold";
              } else if (val === "A") {
                data.cell.styles.textColor = [220, 38, 38];
                data.cell.styles.fontStyle = "bold";
                data.cell.styles.fillColor = [254, 242, 242];
              } else if (val === "C") {
                data.cell.styles.textColor = [126, 34, 206];
                data.cell.styles.fontStyle = "bold";
              }
            },
          });

          // Legenda kode status di bawah tabel
          const finalY = doc.lastAutoTable
            ? doc.lastAutoTable.finalY + 3.5
            : startTableY + 10;
          doc.setFontSize(6.8);
          doc.setTextColor(100);
          doc.text(
            "Keterangan: H = Hadir | S = Sakit | I = Izin | A = Alfa (Tanpa Keterangan) | C = Cabut (Meninggalkan Pembelajaran)",
            10,
            Math.min(finalY, pageHeight - 24),
          );

          // Jika hanya 1 bulan dan chunk terakhir, gambar tanda tangan langsung di halaman ini
          if (isSingleMonth && isLastChunkOfMonth) {
            drawSignatureBlock(doc, finalY);
          }
        });
      });

      // 6. JIKA MENCETAK SEMUA BULAN (MULTI-BULAN): Buat halaman Rekapitulasi Akumulasi Keseluruhan Semester
      if (!isSingleMonth && targetMonthKeys.length > 1) {
        doc.addPage("a4", "landscape");
        const startRecapY = drawKopLandscape(
          doc,
          "Akumulasi Keseluruhan Semester (Semua Bulan)",
          "Ringkasan Kumulatif",
        );

        const totalSemuaPertemuan = rawDataRows.length;
        const recapTableHead = [
          [
            "No",
            "Nama Siswa",
            "Total Hadir",
            "Sakit",
            "Izin",
            "Alfa",
            "Cabut",
            "Total Pertemuan",
            "% Kehadiran Total",
          ],
        ];

        const recapTableBody = [];
        let grandHadirAll = 0,
          grandSakitAll = 0,
          grandIzinAll = 0,
          grandAlfaAll = 0,
          grandCabutAll = 0;

        daftarSiswa.forEach((namaSiswa, sIdx) => {
          let h = 0,
            s = 0,
            i = 0,
            a = 0,
            c = 0;
          rawDataRows.forEach((row) => {
            const st = String(row[sIdx + 2] || "")
              .trim()
              .toLowerCase();
            if (st === "hadir" || st === "h") h++;
            else if (st === "sakit" || st === "s") s++;
            else if (st === "izin" || st === "i") i++;
            else if (st === "alfa" || st === "a") a++;
            else if (st === "cabut" || st === "c") c++;
          });

          grandHadirAll += h;
          grandSakitAll += s;
          grandIzinAll += i;
          grandAlfaAll += a;
          grandCabutAll += c;

          const pct =
            totalSemuaPertemuan > 0
              ? ((h / totalSemuaPertemuan) * 100).toFixed(1) + "%"
              : "0%";

          recapTableBody.push([
            String(sIdx + 1),
            namaSiswa,
            String(h),
            String(s),
            String(i),
            String(a),
            String(c),
            String(totalSemuaPertemuan),
            pct,
          ]);
        });

        // Baris total keseluruhan
        const grandKapasitasAll = totalSiswa * totalSemuaPertemuan;
        const grandPersenAll =
          grandKapasitasAll > 0
            ? ((grandHadirAll / grandKapasitasAll) * 100).toFixed(1) + "%"
            : "0%";

        recapTableBody.push([
          "",
          "TOTAL KESELURUHAN SISWA",
          String(grandHadirAll),
          String(grandSakitAll),
          String(grandIzinAll),
          String(grandAlfaAll),
          String(grandCabutAll),
          String(totalSemuaPertemuan),
          grandPersenAll,
        ]);

        doc.autoTable({
          startY: startRecapY,
          head: recapTableHead,
          body: recapTableBody,
          theme: "grid",
          styles: {
            fontSize: baseFontSize + 0.3,
            cellPadding: baseCellPadding + 0.2,
            lineColor: [226, 232, 240],
            lineWidth: 0.15,
            valign: "middle",
          },
          headStyles: {
            fillColor: [37, 99, 235],
            textColor: [255, 255, 255],
            fontStyle: "bold",
            halign: "center",
          },
          columnStyles: {
            0: { cellWidth: 10, halign: "center" },
            1: { cellWidth: 75, halign: "left", fontStyle: "bold" },
            2: {
              halign: "center",
              textColor: [22, 101, 52],
              fontStyle: "bold",
            },
            3: { halign: "center", textColor: [29, 78, 216] },
            4: { halign: "center", textColor: [180, 83, 9] },
            5: {
              halign: "center",
              textColor: [220, 38, 38],
              fontStyle: "bold",
            },
            6: { halign: "center", textColor: [126, 34, 206] },
            7: { halign: "center" },
            8: { halign: "center", fontStyle: "bold" },
          },
          showHead: "everyPage",
          margin: { left: 10, right: 10, top: 10, bottom: 25 },
          didParseCell: function (data) {
            if (data.row.index === recapTableBody.length - 1) {
              data.cell.styles.fillColor = [241, 245, 249];
              data.cell.styles.fontStyle = "bold";
              data.cell.styles.textColor = [30, 41, 59];
            }
          },
        });

        const finalRecapY = doc.lastAutoTable
          ? doc.lastAutoTable.finalY
          : startRecapY + 20;
        drawSignatureBlock(doc, finalRecapY);
      } else if (!isSingleMonth && targetMonthKeys.length === 1) {
        // Jika hanya ada 1 bulan terdata meskipun opsi ALL dipilih
        const finalY = doc.lastAutoTable ? doc.lastAutoTable.finalY : 150;
        drawSignatureBlock(doc, finalY);
      }

      // 7. Tulis Nomor Halaman Otomatis di Setiap Lembar
      const totalPages = doc.getNumberOfPages();
      for (let p = 1; p <= totalPages; p++) {
        doc.setPage(p);
        doc.setFontSize(6.8);
        doc.setTextColor(140);
        doc.text(
          `Laporan Data Mentah Presensi • SMKN 1 Teluk Kuantan (portalsmkn1telku.vercel.app) — Halaman ${p} dari ${totalPages}`,
          pageWidth / 2,
          pageHeight - 3.8,
          { align: "center" },
        );
      }

      let namaFileBulan = isSingleMonth
        ? targetMonthKeys[0]
        : "Semua_Bulan_Semester";
      namaFileBulan = bersihkanEmojiUntukPDF(namaFileBulan).replace(
        /[^a-zA-Z0-9]/g,
        "_",
      );
      doc.save(`Data-Mentah-Presensi-${kelasAktif}-${namaFileBulan}.pdf`);
      await finishProgress("PDF Data Mentah Berhasil Diunduh!");
    } catch (err) {
      console.error("downloadDataMentahPDF error:", err);
      hideLoading();
      alert("Gagal membuat PDF Data Mentah: " + (err.message || err));
    }
  }

  // Update render tabel edit form data mentah untuk warna
  function renderEditTable() {
    const bulanEl = document.getElementById("editBulan");
    const bulan = bulanEl ? bulanEl.value : "ALL";
    const tbody = document.getElementById("editTbody");
    if (!tbody) return;
    tbody.innerHTML = "";

    const rawRows = window._rawRows || [];
    const rawByMonth = window._rawByMonth || {};

    const sumber =
      bulan === "ALL"
        ? rawRows.map((r, i) => ({ row: r, index: i }))
        : rawByMonth[bulan] || [];

    sumber.forEach(({ row, index }) => {
      if (!row || !Array.isArray(row)) return;
      let tr = "<tr>";
      row.forEach((cell, c) => {
        if (c >= 2) {
          const clsStatus = cell ? String(cell).toLowerCase() : "hadir";
          tr += `<td>
          <select class="input cellEdit select-presensi ${clsStatus}" data-r="${index}" data-c="${c}" onchange="updateSelectColor(this)">
            <option value="Hadir" class="opt-hadir" ${cell === "Hadir" ? "selected" : ""}>Hadir</option>
            <option value="Sakit" class="opt-sakit" ${cell === "Sakit" ? "selected" : ""}>Sakit</option>
            <option value="Izin" class="opt-izin" ${cell === "Izin" ? "selected" : ""}>Izin</option>
            <option value="Alfa" class="opt-alfa" ${cell === "Alfa" ? "selected" : ""}>Alfa</option>
            <option value="Cabut" class="opt-cabut" ${cell === "Cabut" ? "selected" : ""}>Cabut</option>
          </select>
        </td>`;
        } else {
          tr += `<td>${c === 0 ? formatTanggal(cell) : cell || ""}</td>`;
        }
      });
      tr += "</tr>";
      tbody.insertAdjacentHTML("beforeend", tr);
    });
  }
</script>
