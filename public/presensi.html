<!-- ✅ PRESENSI TJKT FINAL 2025 — Versi Profesional UI (Tabel Berwarna & Tombol Admin) -->

<style>
  /* === Variabel Warna & Tema Profesional === */
  :root {
    --bg: #f8fafc;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --info: #0ea5e9;
    --info-hover: #0284c7;
    --success: #16a34a;
    --danger: #dc2626;
    --warning: #f59e0b;
    --dark: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --card-shadow:
      0 4px 10px -1px rgba(245, 158, 11, 0.1),
      0 2px 4px -1px rgba(0, 0, 0, 0.03);
    --card-shadow-hover:
      0 20px 25px -5px rgba(245, 158, 11, 0.2),
      0 10px 10px -5px rgba(245, 158, 11, 0.06);
  }

  body {
    margin: 0;
    background: var(--bg);
    font-family: "Inter", Arial, sans-serif;
    color: var(--dark);
    line-height: 1.5;
  }

  .presensi-root {
    padding: 40px 20px 60px;
  }

  .presensi-root h2 {
    margin: 0 0 40px;
    color: var(--dark);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    text-align: center;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  /* === Badge Judul Penting === */
  .badge-title {
    background: linear-gradient(135deg, #f59e0b, #fbbf24);
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 30px;
    box-shadow: 0 4px 10px rgba(245, 158, 11, 0.3);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border: 2px solid #fff;
  }

  .presensi-grid {
    display: grid !important;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
    min-height: 200px;
  }

  /* === Kartu Kelas === */
  .kelas-card {
    background: linear-gradient(135deg, #ffffff 0%, #fffdf0 50%, #fef08a 100%);
    border-radius: 16px;
    padding: 30px 24px;
    box-shadow: var(--card-shadow);
    text-align: center;
    position: relative;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: 1px solid #fde047;
    min-height: 180px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .kelas-card::before {
    content: "📚";
    font-size: 42px;
    display: block;
    margin-bottom: 12px;
    filter: drop-shadow(0 4px 6px rgba(245, 158, 11, 0.2));
  }

  .kelas-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--card-shadow-hover);
    border-color: #facc15;
  }

  .kelas-card h3 {
    margin: 0 0 20px;
    font-size: 20px;
    color: var(--dark);
    font-weight: 700;
    letter-spacing: -0.3px;
  }

  .kelas-card.tingkat-x {
    border-top: 5px solid #3b82f6;
  }
  .kelas-card.tingkat-xi {
    border-top: 5px solid #10b981;
  }
  .kelas-card.tingkat-xii {
    border-top: 5px solid #f59e0b;
  }

  /* === Tombol === */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: calc(100% - 12px);
    margin: 6px;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }

  .btn-isi {
    background: var(--primary);
    color: #fff;
  }
  .btn-isi:hover {
    background: var(--primary-hover);
    transform: scale(1.02);
  }
  .btn-isi:active {
    transform: scale(0.98);
  }

  .btn-rekap {
    background: var(--info);
    color: #fff;
  }
  .btn-rekap:hover {
    background: var(--info-hover);
    transform: scale(1.02);
  }
  .btn-rekap:active {
    transform: scale(0.98);
  }

  /* Tombol Walas (Di sebelah dropdown) */
  .btn-walas {
    font-size: 12px;
    font-weight: 600;
    background: #f1f5f9;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 0 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    height: 41px; /* Menyesuaikan dengan perkiraan tinggi select */
    white-space: nowrap; /* Mencegah teks turun ke bawah */
  }

  .btn-walas:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
  }

  /* Tombol Superadmin */
  .btn-superadmin {
    background: var(--dark);
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    transition: all 0.2s;
  }
  .btn-superadmin:hover {
    background: #1e293b;
    transform: translateY(-2px);
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
  }

  /* === Form Element === */
  .input,
  select,
  textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    margin-top: 6px;
    margin-bottom: 12px;
    font-family: inherit;
    color: var(--dark);
    background-color: #fff;
    transition: all 0.2s;
    box-sizing: border-box;
  }

  .input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }

  /* Warna Pilihan Presensi */
  .select-presensi {
    font-weight: 600;
    transition:
      background-color 0.3s,
      color 0.3s;
  }
  .select-presensi.hadir {
    background-color: #dcfce7 !important;
    color: #15803d !important;
    border-color: #bbf7d0;
  }
  .select-presensi.sakit {
    background-color: #fef3c7 !important;
    color: #b45309 !important;
    border-color: #fde68a;
  }
  .select-presensi.izin {
    background-color: #e0f2fe !important;
    color: #0369a1 !important;
    border-color: #bae6fd;
  }
  .select-presensi.alfa {
    background-color: #ffedd5 !important;
    color: #c2410c !important;
    border-color: #fed7aa;
  }
  .select-presensi.cabut {
    background-color: #fee2e2 !important;
    color: #b91c1c !important;
    border-color: #fecaca;
  }

  .opt-hadir {
    background-color: #dcfce7;
    color: #15803d;
    font-weight: bold;
  }
  .opt-sakit {
    background-color: #fef3c7;
    color: #b45309;
    font-weight: bold;
  }
  .opt-izin {
    background-color: #e0f2fe;
    color: #0369a1;
    font-weight: bold;
  }
  .opt-alfa {
    background-color: #ffedd5;
    color: #c2410c;
    font-weight: bold;
  }
  .opt-cabut {
    background-color: #fee2e2;
    color: #b91c1c;
    font-weight: bold;
  }

  /* === Popup Overlay === */
  .popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 24px;
    backdrop-filter: blur(5px);
  }
  .popup-overlay[style*="flex"] {
    pointer-events: auto;
  }
  .popup-overlay:not([style*="flex"]) {
    pointer-events: none;
  }

  .popup {
    background: #fff;
    border-radius: 20px;
    width: 100%;
    max-width: 900px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    padding: 32px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    animation: popupFade 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes popupFade {
    from {
      opacity: 0;
      transform: translateY(10px) scale(0.98);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .close {
    position: absolute;
    right: 20px;
    top: 20px;
    background: #f1f5f9;
    color: var(--text-muted);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: bold;
    font-size: 16px;
  }
  .close:hover {
    background: #e2e8f0;
    color: var(--danger);
    transform: rotate(90deg);
  }

  /* === Tombol Aksi di Popup === */
  .action-btn,
  .action-save,
  .action-edit,
  .action-del {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
    font-family: inherit;
    margin-right: 6px;
  }
  .action-save {
    background: var(--success);
    color: #fff;
  }
  .action-edit {
    background: var(--warning);
    color: #fff;
  }
  .action-del {
    background: var(--danger);
    color: #fff;
  }

  .action-save:hover,
  .action-edit:hover,
  .action-del:hover {
    filter: brightness(1.1);
    transform: translateY(-2px);
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
  }
  .action-save:active,
  .action-edit:active,
  .action-del:active {
    transform: translateY(0);
  }

  /* === Tabel (Desain Clean dengan Sentuhan Warna Elegan) === */
  .table-freeze-wrapper {
    max-height: 65vh;
    overflow: auto;
    position: relative;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.02);
  }

  .table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 14px;
  }
  .table th,
  .table td {
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }
  .table th:last-child,
  .table td:last-child {
    border-right: none;
  }

  /* Header Tabel Warna Emas/Kuning Halus */
  .table th {
    background: linear-gradient(135deg, #fffbeb, #fef3c7);
    font-weight: 600;
    color: #92400e;
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.5px;
    border-bottom: 2px solid #fde68a;
  }
  .table tr:last-child td {
    border-bottom: none;
  }
  /* Zebra cross table (selang-seling warna) */
  .table tbody tr:nth-child(even) td {
    background: #fffdf0;
  }
  .table tbody tr:hover td {
    background: #fef9c3;
  }

  /* Freeze Header & Kolom Kiri */
  .table-freeze-wrapper thead th {
    position: sticky;
    top: 0;
    background: #fffbeb;
    z-index: 3;
    box-shadow: 0 2px 0 #fde68a;
  }
  .table-freeze-wrapper th:first-child,
  .table-freeze-wrapper td:first-child {
    position: sticky;
    left: 0;
    background: #fff;
    z-index: 2;
    box-shadow: 2px 0 0 var(--border);
  }
  /* Efek Hover dan Zebra di Kolom Kiri (Freeze) */
  .table-freeze-wrapper tr:nth-child(even) td:first-child {
    background: #fffdf0;
  }
  .table-freeze-wrapper tr:hover td:first-child {
    background: #fef9c3;
  }
  .table-freeze-wrapper thead th:first-child {
    z-index: 4;
    background: #fffbeb;
    box-shadow: 2px 2px 0 #fde68a;
  }

  /* Scrollbar Elegan untuk Tabel & Popup */
  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }
  ::-webkit-scrollbar-track {
    background: #f1f5f9;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb {
    background: #cbd5e1;
    border-radius: 4px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: #94a3b8;
  }

  /* === Details & Summary === */
  details {
    background: #f8fafc;
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  details summary {
    cursor: pointer;
    font-weight: 600;
    color: var(--dark);
    list-style: none;
    display: flex;
    align-items: center;
  }
  details summary::before {
    content: "▸";
    margin-right: 8px;
    transition: transform 0.2s;
  }
  details[open] summary::before {
    transform: rotate(90deg);
  }
  details p {
    margin: 12px 0 0;
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* === DATA MENTAH FULL HEIGHT === */
  .raw-full {
    max-height: calc(100vh - 180px);
    overflow-y: auto;
  }

  /* === WARNA PERSENTASE KEHADIRAN (Lebih Halus) === */
  .persen-merah {
    background: #fee2e2 !important;
    color: #b91c1c !important;
    font-weight: 700;
    text-align: center;
  }
  .persen-kuning {
    background: #fef3c7 !important;
    color: #b45309 !important;
    font-weight: 700;
    text-align: center;
  }
  .persen-hijau {
    background: #dcfce7 !important;
    color: #15803d !important;
    font-weight: 700;
    text-align: center;
  }

  /* =========================================
   === RESPONSIVE PADAT (COMPACT) MOBILE ===
   ========================================= */
  @media (max-width: 720px) {
    .presensi-root {
      padding: 16px 12px 30px;
    }
    .presensi-root h2 {
      font-size: 20px;
      margin-bottom: 24px;
      gap: 6px;
    }
    .presensi-grid {
      gap: 12px;
      grid-template-columns: 1fr;
    }

    .kelas-card {
      padding: 20px 16px;
      min-height: 140px;
    }
    .kelas-card::before {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .kelas-card h3 {
      font-size: 18px;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      margin: 4px 0;
      padding: 10px;
      font-size: 13px;
      border-radius: 8px;
    }
    .input,
    select,
    textarea {
      padding: 8px 12px;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .popup-overlay {
      padding: 12px;
    }
    .popup {
      max-width: 100%;
      padding: 20px 16px;
      border-radius: 12px;
    }
    .close {
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      font-size: 14px;
    }

    .table th,
    .table td {
      padding: 8px 10px;
      font-size: 12px;
    }
    .table th {
      font-size: 11px;
    }

    .action-save,
    .action-edit,
    .action-del {
      padding: 8px 12px;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .badge-title {
      font-size: 11px;
      padding: 4px 12px;
    }
  }

  /* Animasi Loading Spinner */
  .loading-box {
    text-align: center;
    padding: 40px;
  }
  .spinner {
    border: 4px solid #e2e8f0;
    border-top: 4px solid var(--primary);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    margin: 0 auto 16px;
  }
  .loading-text {
    font-weight: 500;
    color: var(--text-muted);
  }
  @keyframes spin {
    0% {
      transform: rotate(0deg);
    }
    100% {
      transform: rotate(360deg);
    }
  }
</style>

<div class="presensi-root">
  <div style="display: flex; justify-content: center; margin-bottom: 12px">
    <img
      id="logoSekolahEl"
      src="/logo.png"
      alt="Logo SMKN 1 Teluk Kuantan"
      crossorigin="anonymous"
      style="width: 64px; height: 64px; object-fit: contain"
      onerror="this.style.display = 'none'"
    />
  </div>
  <h2><span class="badge-title">SMKN 1 TELUK KUANTAN</span></h2>
  <div id="kelasGrid" class="presensi-grid"></div>
</div>

<div id="overlay" class="popup-overlay">
  <div class="popup">
    <div class="close" onclick="closeOverlay()">✕</div>
    <div id="popupBody"></div>
  </div>
</div>

<script>
  function hitungTotalPertemuanAll() {
    const setHari = new Set();
    Object.values(window._bulanan || {}).forEach((perSiswa) => {
      Object.values(perSiswa).forEach((b) => {
        b.hari.forEach((h) => setHari.add(h));
      });
    });
    return setHari.size;
  }

  function updateJudulRekap(bulanKey) {
    const judul = document.getElementById("rekapJudul");
    const sub = document.getElementById("rekapSubJudul");
    if (!judul || !sub) return;

    if (bulanKey === "ALL") {
      judul.innerText = "Rekap Kehadiran";
      sub.innerHTML = `Kelas: <b>${currentSheet}</b> — Semua Bulan`;
      return;
    }

    const [y, m] = bulanKey.split("-");
    const namaBulan = [
      "Januari",
      "Februari",
      "Maret",
      "April",
      "Mei",
      "Juni",
      "Juli",
      "Agustus",
      "September",
      "Oktober",
      "November",
      "Desember",
    ];
    judul.innerText = "📊 Rekap Kehadiran";
    sub.innerHTML = `Kelas: <b>${currentSheet}</b> — Bulan: <b>${namaBulan[+m]} ${y}</b>`;
  }

  // Fungsi helper untuk mewarnai dropdown presensi otomatis
  function updateSelectColor(el) {
    el.classList.remove("hadir", "sakit", "izin", "alfa", "cabut");
    if (el.value) {
      el.classList.add(el.value.toLowerCase());
    }
  }

  /* === KONFIGURASI === */
  const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbyPCKZSnnr_O6yRKBgok2XEHC9MRERDFa8t5a-SO5RPDy52xnQknAxgCFlUzouSBVfP/exec";
  const KELAS = [
    // === KELAS X ===
    //{ id: "XDPIB", label: "X DPIB", tingkat: "X" },
    //{ id: "XGEOMATIKA", label: "X GEOMATIKA", tingkat: "X" },
    //{ id: "XTAV", label: "X TAV", tingkat: "X" },
    //{ id: "XTITL1", label: "X TITL 1", tingkat: "X" },
    //{ id: "XTITL2", label: "X TITL 2", tingkat: "X" },
    { id: "XTJKT1", label: "X TJKT 1", tingkat: "X" },
    { id: "XTJKT2", label: "X TJKT 2", tingkat: "X" },

    //{ id: "XTO2", label: "X TO 2", tingkat: "X" },
    //{ id: "XTO3", label: "X TO 3", tingkat: "X" },
    //{ id: "XTO4", label: "X TO 4", tingkat: "X" },
    { id: "XTPL", label: "X TPL", tingkat: "X" },

    // === KELAS XI ===
    //{ id: "XIDPIB", label: "XI DPIB", tingkat: "XI" },
    //{ id: "XIGEOMATIKA", label: "XI GEOMATIKA", tingkat: "XI" },
    //{ id: "XITAB", label: "XI TAB", tingkat: "XI" },
    //{ id: "XITAV", label: "XI TAV", tingkat: "XI" },
    //{ id: "XITBSM1", label: "XI TBSM 1", tingkat: "XI" },
    //{ id: "XITBSM2", label: "XI TBSM 2", tingkat: "XI" },
    //{ id: "XITITL1", label: "XI TITL 1", tingkat: "XI" },

    { id: "XITJKT1", label: "XI TJKT 1", tingkat: "XI" },

  /* === RENDER 1 CARD SAJA === */
  const grid = document.getElementById("kelasGrid");

  function buildOptgroupKelas() {
    const tingkatUrutan = ["X", "XI", "XII"];
    return tingkatUrutan
      .map((tingkat) => {

          .map((k) => `<option value="${k.id}">${k.label}</option>`)

  async function submitPresensi(sheet) {
    try {
      const pass = document.getElementById("presPass").value.trim();
      const res = await fetch(`${SCRIPT_URL}?sheet=${sheet}`);
      const d = await res.json();
      if (d.classPassword !== pass) {
        alert("❌ Password kelas salah!");
        return;
      }
      const form = document.getElementById("formPresensi");
      const entries = {};
      for (let el of form.elements) {
        if (el.name) entries[el.name] = el.value;
      }
      const body = {
        action: "addPresensi",
        kelas: sheet,
        password: pass,
        entries,
      };
      const r = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(body),
      });
      const j = await r.json();
      if (j.ok) {
        alert("✅ Presensi tersimpan");
        closeOverlay();
      } else {
        alert("❌ Gagal: " + (j.error || "Terjadi kesalahan"));

  /* === ADMIN / LOGIN WALAS === */
  // Password admin per kelas disimpan di localStorage (per perangkat)
  // supaya tidak perlu diketik ulang tiap buka Login Walas. Kalau
  // perangkat dipakai bersama, pakai tombol "Logout Walas" di dalam
  // modal untuk menghapus cache-nya.
  let adminPasswordAktif = null;

  function getCacheWalas() {
    try {
      return JSON.parse(localStorage.getItem("walasAuth") || "{}");
    } catch (e) {
      return {};
    }
  }
  function simpanCacheWalas(sheet, password) {
    const cache = getCacheWalas();
    cache[sheet] = password;
    localStorage.setItem("walasAuth", JSON.stringify(cache));
  }
  function hapusCacheWalas(sheet) {
    const cache = getCacheWalas();
    delete cache[sheet];
    localStorage.setItem("walasAuth", JSON.stringify(cache));
  }

  async function cekPasswordKeServer(sheet, password) {
    const r = await fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "verifyAdminKelas",
        kelas: sheet,
        password,
      }),
    });
    return r.json();
  }

  async function openAdminPrompt(sheet) {
    // 1) Coba pakai password yang sudah tersimpan dulu (login otomatis)
    const cache = getCacheWalas();
    const passTersimpan = cache[sheet];

    if (passTersimpan) {
      try {
        const j = await cekPasswordKeServer(sheet, passTersimpan);
        if (j.ok) {
          adminPasswordAktif = passTersimpan;
          return openAdminModal(sheet);
        }
        // Password tersimpan sudah tidak valid (mis. diganti admin lain)
        hapusCacheWalas(sheet);
      } catch (err) {
        // Kalau network gagal, lanjut ke prompt manual di bawah
      }
    }

    // 2) Belum ada cache / cache tidak valid → minta password manual
    const k = KELAS.find((x) => x.id === sheet);
    const inpw = prompt(`Masukkan password admin untuk ${k.label}`);
    if (!inpw) return;

    try {
      const j = await cekPasswordKeServer(sheet, inpw);
      if (!j.ok) return alert("❌ Password admin salah!");
      adminPasswordAktif = inpw;
      simpanCacheWalas(sheet, inpw);
      openAdminModal(sheet);
    } catch (err) {
      alert("Gagal memverifikasi password admin: " + (err.message || err));
    }
  }

  function logoutWalas(sheet) {
    hapusCacheWalas(sheet);
    adminPasswordAktif = null;
    alert("Sesi Login Walas untuk kelas ini sudah dihapus dari perangkat ini.");
    closeOverlay();
  }

  async function simpanDanCetakLaporanWalas(sheet) {
    const namaGuru = window._namaGuruAktif || "";

    const dataPermasalahan = [
      ...document.querySelectorAll("#tabelPermasalahan .baris-walas"),
    ]
      .map((div) => ({
        namaSiswa: div.querySelector(".walas-nama")?.value.trim() || "",
        proses: div.querySelector(".walas-proses")?.value.trim() || "",
        keterangan: div.querySelector(".walas-ket")?.value.trim() || "",
      }))
      .filter((it) => it.namaSiswa);

    const dataKondisiKelas = [
      ...document.querySelectorAll("#tabelKondisiKelas .baris-walas"),
    ]
      .map((div) => ({
        piket: div.querySelector(".walas-piket")?.value.trim() || "",
        inventaris: div.querySelector(".walas-inventaris")?.value.trim() || "",
        keterangan: div.querySelector(".walas-ket")?.value.trim() || "",
      }))
      .filter((it) => it.piket || it.inventaris || it.keterangan);

    const dataMutasi = [
      ...document.querySelectorAll("#tabelMutasi .baris-walas"),
    ]
      .map((div) => ({
        namaSiswa: div.querySelector(".walas-nama")?.value.trim() || "",
        keluar: div.querySelector(".walas-keluar")?.value.trim() || "",
        masuk: div.querySelector(".walas-masuk")?.value.trim() || "",
        tanggal: div.querySelector(".walas-tanggal")?.value || "",
      }))
      .filter((it) => it.namaSiswa);

    // Bagian B disimpan ke sheet WALAS. Bagian C & D sengaja tidak
    // dikirim ke server — cuma dipakai untuk cetak PDF.
    if (dataPermasalahan.length > 0) {
      if (!adminPasswordAktif) {
        return alert(
          "Sesi Login Walas tidak ditemukan, silakan Login Walas lagi.",
        );
      }
      try {
        const r = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "simpanWalasPermasalahan",
            kelas: sheet,
            adminPassword: adminPasswordAktif,
            namaGuru,
            items: dataPermasalahan,
          }),
        });
        const j = await r.json();
        if (!j.ok) {
          alert(
            "⚠️ Gagal menyimpan Bagian B ke sistem: " +
              (j.error || "Terjadi kesalahan") +
              "\n\nPDF tetap akan dicetak dengan data yang sudah diisi.",
          );
        }
      } catch (err) {
        alert(
          "⚠️ Gagal menyimpan Bagian B ke sistem: " +
            (err.message || err) +
            "\n\nPDF tetap akan dicetak.",
        );
      }
    }

    const bulanKey = document.getElementById("bulanLampiranA")?.value || "ALL";

    await cetakPdfLaporanWalas(
      sheet,
      namaGuru,
      dataPermasalahan,
      dataKondisiKelas,
      dataMutasi,
      bulanKey,
    );
  }

  /* === DATA MENTAH REKAP KEHADIRAN (untuk Lampiran A) ===
     Dipecah jadi 2 tahap: (1) ambil & kelompokkan data mentah per
     bulan sekali saat form dibuka, (2) hitung ulang totalnya sesuai
     bulan yang dipilih tepat sebelum PDF dicetak — tanpa fetch ulang. */
  async function ambilDataMentahUntukLampiranA(sheet) {
    const res = await fetch(`${SCRIPT_URL}?sheet=${sheet}&action=all`);
    const d = await res.json();
    const rows = d.values || [];
    if (rows.length < 2) {
      return { headers: [], bulanan: {}, bulanList: [], totalRows: 0 };
    }

    const headers = rows[0].slice(2);
    const bulanan = {}; // nama -> { "tahun-bulan": {hadir,sakit,izin,alfa,cabut,hari:Set} }
    const bulanSet = new Set();

    for (let r = 1; r < rows.length; r++) {
      const row = rows[r];
      const waktu = row[0];
      if (!waktu) continue;
      const tgl = new Date(waktu);
      if (isNaN(tgl.getTime())) continue;

      const bk = `${tgl.getFullYear()}-${tgl.getMonth()}`;
      const hariKey = tgl.toDateString();
      bulanSet.add(bk);

      row.slice(2).forEach((st, i) => {
        const nama = headers[i];
        if (!nama) return;
        if (!bulanan[nama]) bulanan[nama] = {};
        if (!bulanan[nama][bk]) {
          bulanan[nama][bk] = {
            hadir: 0,
            sakit: 0,
            izin: 0,
            alfa: 0,
            cabut: 0,
            hari: new Set(),
          };
        }
        bulanan[nama][bk].hari.add(hariKey);
        const status = (st || "").toString();
        if (status === "Hadir") bulanan[nama][bk].hadir++;
        else if (status === "Sakit") bulanan[nama][bk].sakit++;
        else if (status === "Izin") bulanan[nama][bk].izin++;
        else if (status === "Alfa") bulanan[nama][bk].alfa++;
        else if (status === "Cabut") bulanan[nama][bk].cabut++;
      });
    }

    return {
      headers,
      bulanan,
      bulanList: [...bulanSet].sort(),
      totalRows: rows.length - 1,
    };
  }

  function hitungRekapDariDataMentah(dataMentah, bulanKey) {
    const { headers, bulanan, totalRows } = dataMentah;
    const pilihBulan = bulanKey && bulanKey !== "ALL" ? bulanKey : "ALL";

    let totals, totalPertemuan;

    if (pilihBulan === "ALL") {
      totals = headers.map((nama) => {
        const perBulan = bulanan[nama] || {};
        const agg = { Hadir: 0, Sakit: 0, Izin: 0, Alfa: 0, Cabut: 0 };
        Object.values(perBulan).forEach((b) => {
          agg.Hadir += b.hadir;
          agg.Sakit += b.sakit;
          agg.Izin += b.izin;
          agg.Alfa += b.alfa;
          agg.Cabut += b.cabut;
        });
        return agg;
      });

      const setHariAll = new Set();
      headers.forEach((nama) => {
        const perBulan = bulanan[nama] || {};
        Object.values(perBulan).forEach((b) =>
          b.hari.forEach((h) => setHariAll.add(h)),
        );
      });
      totalPertemuan = setHariAll.size || totalRows;
    } else {
      totals = headers.map((nama) => {
        const b = (bulanan[nama] && bulanan[nama][pilihBulan]) || {
          hadir: 0,
          sakit: 0,
          izin: 0,
          alfa: 0,
          cabut: 0,
        };
        return {
          Hadir: b.hadir,
          Sakit: b.sakit,
          Izin: b.izin,
          Alfa: b.alfa,
          Cabut: b.cabut,
        };
      });

      const setHariBulan = new Set();
      headers.forEach((nama) => {
        const b = bulanan[nama] && bulanan[nama][pilihBulan];
        if (b) b.hari.forEach((h) => setHariBulan.add(h));
      });
      totalPertemuan = setHariBulan.size;
    }

    const totalSiswa = headers.length;
    const totalHadir = totals.reduce((sum, t) => sum + (t.Hadir || 0), 0);
    const kapasitas = totalSiswa * totalPertemuan;
    const rataKehadiran = kapasitas
      ? ((totalHadir / kapasitas) * 100).toFixed(2)
      : "0.00";

    return {
      headers,
      totals,
      sessionCount: totalPertemuan,
      totalPertemuan,
      totalSiswa,
      rataKehadiran,
    };
  }

  async function cetakPdfLaporanWalas(
    sheet,
    namaGuru,
    dataPermasalahan,
    dataKondisiKelas,
    dataMutasi,
    bulanKey,
  ) {
    showLoading("Menyiapkan Lampiran A (Rekap Kehadiran)...");
    const dataMentah =
      window._dataMentahLampiranA ||
      (await ambilDataMentahUntukLampiranA(sheet));
    const rekap = hitungRekapDariDataMentah(dataMentah, bulanKey || "ALL");

    const namaBulanTerpilih =
      bulanKey && bulanKey !== "ALL"
        ? (() => {
            const [thn, bln] = bulanKey.split("-").map(Number);
            return new Date(thn, bln, 1).toLocaleDateString("id-ID", {
              month: "long",
              year: "numeric",
            });
          })()
        : "Semua Bulan";

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF("p", "mm", "a4");
    const pageWidth = doc.internal.pageSize.getWidth();
    const jumlahSiswa = (window._rosterAktif || []).length;
    const tanggalCetak = new Date().toLocaleDateString("id-ID", {
      day: "2-digit",
      month: "long",
      year: "numeric",
    });

    // === KOP / COVER ===
    const logoEl = document.getElementById("logoSekolahEl");
    let y = 14;
    if (logoEl && logoEl.complete && logoEl.naturalWidth > 0) {
      try {
        doc.addImage(logoEl, "PNG", (pageWidth - 20) / 2, 8, 20, 20);
        y = 8 + 20 + 6;
      } catch (e) {
        // lanjut tanpa logo kalau gagal ditempel
      }
    }

    doc.setFontSize(14);
    doc.setFont(undefined, "bold");
    doc.text("SMKN 1 TELUK KUANTAN", pageWidth / 2, y, { align: "center" });
    doc.setFontSize(12);
    doc.text("LAPORAN GURU WALI KELAS", pageWidth / 2, y + 6, {
      align: "center",
    });
    doc.setFont(undefined, "normal");

    y += 16;
    doc.setDrawColor(0);
    doc.setLineWidth(0.5);
    doc.line(15, y, pageWidth - 15, y);
    y += 8;

    // === A. IDENTITAS ===
    doc.setFontSize(10);
    const identitas = [
      ["Nama Guru Wali", namaGuru || "-"],
      ["Kelas", sheet],
      ["Jumlah Siswa", String(jumlahSiswa)],
      ["Tanggal Cetak", tanggalCetak],
    ];
    identitas.forEach(([label, value], i) => {
      const yy = y + i * 6;
      doc.text(label, 15, yy);
      doc.text(":", 60, yy);
      doc.text(String(value), 64, yy);
    });
    y += identitas.length * 6 + 10;

    // === LAMPIRAN A. REKAP KEHADIRAN SISWA (model tabel sama seperti
    // PDF Rekap Kehadiran yang sudah ada) ===
    doc.setFontSize(11);
    doc.setFont(undefined, "bold");
    doc.text("LAMPIRAN A. REKAP KEHADIRAN SISWA", 15, y);
    doc.setFont(undefined, "normal");
    doc.setFontSize(9);
    doc.setTextColor(100);
    doc.text(`Periode: ${namaBulanTerpilih}`, 15, y + 5);
    doc.setTextColor(0);
    y += 10;

    // === 3 KARTU RINGKASAN (Total Siswa / Total Pertemuan / Rata-rata) ===
    {
      const cardW = 55;
      const cardH = 18;
      const gap = 6;
      const startX = (pageWidth - (cardW * 3 + gap * 2)) / 2;
      doc.setDrawColor(180);
      doc.setFillColor(255, 255, 255);

      function drawCardLampiranA(x, judul, nilai) {
        doc.rect(x, y, cardW, cardH);
        doc.setFontSize(8.5);
        doc.text(judul, x + cardW / 2, y + 6.5, { align: "center" });
        doc.setFontSize(12);
        doc.text(String(nilai), x + cardW / 2, y + 13.5, { align: "center" });
      }

      drawCardLampiranA(startX, "Total Siswa", rekap.totalSiswa);
      drawCardLampiranA(
        startX + cardW + gap,
        "Total Pertemuan",
        rekap.totalPertemuan,
      );
      drawCardLampiranA(
        startX + (cardW + gap) * 2,
        "Rata-rata Kehadiran",
        rekap.rataKehadiran + "%",
      );
      y += cardH + 10;
    }

    const bodyA =
      rekap.headers.length > 0
        ? rekap.headers.map((name, i) => {
            const t = rekap.totals[i];
            const hadir = t.Hadir || 0;
            const persen =
              rekap.sessionCount > 0
                ? ((hadir / rekap.sessionCount) * 100).toFixed(2)
                : "0.00";
            return [
              i + 1,
              name,
              hadir,
              t.Sakit || 0,
              t.Izin || 0,
              t.Alfa || 0,
              t.Cabut || 0,
              persen + "%",
            ];
          })
        : [["-", "Belum ada data presensi", "-", "-", "-", "-", "-", "-"]];

    doc.autoTable({
      startY: y + 4,
      head: [
        [
          "No",
          "Nama Lengkap",
          "Hadir",
          "Sakit",
          "Izin",
          "Alfa",
          "Cabut",
          "% Kehadiran",
        ],
      ],
      body: bodyA,
      theme: "grid",
      styles: {
        fontSize: 8,
        halign: "center",
        valign: "middle",
        cellPadding: 2,
      },
      headStyles: { fillColor: [240, 240, 240], textColor: 0, fontSize: 9 },
      columnStyles: {
        0: { cellWidth: 8 },
        1: { cellWidth: 45 },
        2: { cellWidth: 15 },
        3: { cellWidth: 15 },
        4: { cellWidth: 15 },
        5: { cellWidth: 15 },
        6: { cellWidth: 15 },
        7: { cellWidth: 20 },
      },
      didParseCell(data) {
        if (data.column.index === 7 && data.section === "body") {
          const v = parseFloat(data.cell.raw);
          if (v < 50) data.cell.styles.textColor = [200, 0, 0];
          else if (v < 70) data.cell.styles.textColor = [200, 140, 0];
          else data.cell.styles.textColor = [0, 140, 70];
        }
      },
      margin: { left: 15, right: 15 },
    });
    y = doc.lastAutoTable.finalY + 12;

    if (y > 250) {
      doc.addPage();
      y = 20;
    }

    // === LAMPIRAN B. PERMASALAHAN SISWA ===
    doc.setFontSize(11);
    doc.setFont(undefined, "bold");
    doc.text("LAMPIRAN B. PERMASALAHAN SISWA", 15, y);
    doc.setFont(undefined, "normal");

    const bodyB =
      dataPermasalahan.length > 0
        ? dataPermasalahan.map((it, i) => [
            i + 1,
            it.namaSiswa,
            it.proses || "-",
            it.keterangan || "-",
          ])
        : [["-", "-", "-", "-"]];

    doc.autoTable({

  /* === FORMAT TIMESTAMP → DD/MM/YYYY === */
  function formatTanggal(value) {
    const d = new Date(value);
    if (isNaN(d)) return value;
    const dd = d.getDate().toString().padStart(2, "0");
    const mm = (d.getMonth() + 1).toString().padStart(2, "0");
    const yyyy = d.getFullYear();
    return `${dd}/${mm}/${yyyy}`;
  }

      );

      });

      html += `</tr></thead><tbody>`;

      data.forEach((row) => {
        html += `<tr>`;
        row.forEach((cell, i) => {
          if (i !== passIndex) {
            if (headers[i].toLowerCase().includes("timestamp")) {

            } else {
              html += `<td>${cell}</td>`;

        html += `</tr>`;

  function applyBulanFilter(bulanKey) {
    let setHariBulan = new Set();
    let totalSiswa = 0;
    let totalHadir = 0;
    let totalPertemuan = 0;

    updateJudulRekap(bulanKey);
    document.querySelectorAll(".rekap-row").forEach((row) => {
      const nama = row.dataset.nama;

      if (bulanKey === "ALL") {
        row.querySelector(".col-hadir").innerText = row.dataset.hadir;
        row.querySelector(".col-sakit").innerText = row.dataset.sakit;
        row.querySelector(".col-izin").innerText = row.dataset.izin;
        row.querySelector(".col-alfa").innerText = row.dataset.alfa;
        row.querySelector(".col-cabut").innerText = row.dataset.cabut;

        const td = row.querySelector(".col-persen");
        const persenNum = parseFloat(row.dataset.persen);

        td.innerText = persenNum.toFixed(2) + "%";

        td.classList.remove("persen-merah", "persen-kuning", "persen-hijau");

        if (persenNum < 50) td.classList.add("persen-merah");
        else if (persenNum < 70) td.classList.add("persen-kuning");
        else td.classList.add("persen-hijau");

        totalSiswa++;
        totalHadir += parseInt(row.dataset.hadir || 0);
        return;
      }

      const r = window._bulanan?.[nama]?.[bulanKey];
      if (!r) {
        row.querySelector(".col-hadir").innerText = "0";
        row.querySelector(".col-sakit").innerText = "0";
        row.querySelector(".col-izin").innerText = "0";
        row.querySelector(".col-alfa").innerText = "0";
        row.querySelector(".col-cabut").innerText = "0";
        row.querySelector(".col-persen").innerText = "0%";
        return;
      }

      if (r) {
        totalSiswa++;
        totalHadir += r.hadir;
        r.hari.forEach((h) => {
          setHariBulan.add(h);
        });
      }

      row.querySelector(".col-hadir").innerText = r.hadir;
      row.querySelector(".col-sakit").innerText = r.sakit;
      row.querySelector(".col-izin").innerText = r.izin;
      row.querySelector(".col-alfa").innerText = r.alfa;
      row.querySelector(".col-cabut").innerText = r.cabut;

      const total = r.hari.size;
      const persenNum = total ? (r.hadir / total) * 100 : 0;

      const td = row.querySelector(".col-persen");

      td.classList.remove("persen-merah", "persen-kuning", "persen-hijau");

      if (persenNum < 50) {
        td.classList.add("persen-merah");
      } else if (persenNum < 70) {
        td.classList.add("persen-kuning");
      } else {
        td.classList.add("persen-hijau");
      }

      td.innerText = persenNum.toFixed(2) + "%";
    });

    if (bulanKey === "ALL") {
      totalPertemuan = hitungTotalPertemuanAll();
    } else {
      totalPertemuan = setHariBulan.size;
    }

    document.getElementById("ringTotalSiswa").innerText = totalSiswa;
    document.getElementById("ringTotalPertemuan").innerText = totalPertemuan;

    const kapasitas = totalSiswa * totalPertemuan;
    const rata = kapasitas
      ? ((totalHadir / kapasitas) * 100).toFixed(2)
      : "0.00";
    document.getElementById("ringRataKehadiran").innerText = rata + "%";
  }

  /* === Bersihkan emoji sebelum dikirim ke jsPDF ===
     Font default jsPDF (WinAnsiEncoding) tidak mendukung emoji —
     kalau dibiarkan, hasilnya karakter rusak semacam "Ø=ÜÊ" di PDF.
     Emoji aman dipakai di tampilan HTML biasa, jadi fungsi ini HANYA
     dipakai tepat sebelum teks masuk ke doc.text()/autoTable(). */
  function bersihkanEmojiUntukPDF(teks) {
    return String(teks || "")
      .replace(
        /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}\uFE0F]/gu,
        "",
      )
      .replace(/\s{2,}/g, " ")
      .trim();
  }

  function downloadPDF() {
    const { jsPDF } = window.jspdf;

    const doc = new jsPDF("p", "mm", "a4");
    const pageWidth = doc.internal.pageSize.getWidth();

    const totalSiswa =
      document.getElementById("ringTotalSiswa")?.innerText || "0";
    const totalPertemuan =
      document.getElementById("ringTotalPertemuan")?.innerText || "0";
    const rata =
      document.getElementById("ringRataKehadiran")?.innerText || "0%";

    const title = bersihkanEmojiUntukPDF(
      document.getElementById("rekapJudul")?.innerText || "Rekap Kehadiran",
    );
    const sub = bersihkanEmojiUntukPDF(
      document.getElementById("rekapSubJudul")?.innerText || "",
    );

    // === LOGO SEKOLAH (kalau berhasil dimuat) ===
    const logoEl = document.getElementById("logoSekolahEl");
    let yMulai = 14;
    if (logoEl && logoEl.complete && logoEl.naturalWidth > 0) {
      try {
        const logoW = 18;
        const logoH = 18;
        doc.addImage(logoEl, "PNG", (pageWidth - logoW) / 2, 8, logoW, logoH);
        yMulai = 8 + logoH + 6;
      } catch (e) {
        // kalau logo gagal ditempel (mis. CORS), lanjut tanpa logo
      }
    }

    doc.setFontSize(14);
    doc.setTextColor(0);
    doc.text(title, pageWidth / 2, yMulai, { align: "center" });

    doc.setFontSize(10);
    doc.text(sub, pageWidth / 2, yMulai + 6, { align: "center" });

    // === IDENTITAS GURU WALI & JUMLAH SISWA ===
    const namaGuruWali = bersihkanEmojiUntukPDF(window._namaGuruAktif || "-");
    const jumlahSiswaRoster = window._jumlahSiswaAktif || totalSiswa;
    doc.setFontSize(9);
    doc.setTextColor(90);
    doc.text(
      `Guru Wali/Pembimbing: ${namaGuruWali || "-"}   |   Jumlah Siswa: ${jumlahSiswaRoster}`,
      pageWidth / 2,
      yMulai + 12,
      { align: "center" },
    );
    doc.setTextColor(0);

    let yCard = yMulai + 20;
    const cardW = 55;
    const cardH = 20;
    const gap = 6;
    const startX = (pageWidth - (cardW * 3 + gap * 2)) / 2;

    doc.setDrawColor(180);
    doc.setFillColor(255, 255, 255);
    doc.setTextColor(0);

    function drawCard(x, title, value) {
      doc.rect(x, yCard, cardW, cardH);
      doc.setFontSize(9);
      doc.text(title, x + cardW / 2, yCard + 7, { align: "center" });
      doc.setFontSize(13);
      doc.text(value.toString(), x + cardW / 2, yCard + 15, {
        align: "center",
      });
    }

    drawCard(startX, "Total Siswa", totalSiswa);
    drawCard(startX + cardW + gap, "Total Pertemuan", totalPertemuan);
    drawCard(startX + (cardW + gap) * 2, "Rata-rata Kehadiran", rata);

    const head = [
      [
        "No",
        "Nama Lengkap",
        "Hadir",
        "Sakit",
        "Izin",
        "Alfa",
        "Cabut",
        "% Kehadiran",
      ],
    ];

    const body = [];
    document.querySelectorAll(".rekap-row").forEach((tr) => {
      const row = [];
      tr.querySelectorAll("td").forEach((td) => {
        row.push(td.innerText.trim());
      });
      body.push(row);
    });

    doc.autoTable({
      startY: yCard + cardH + 8,
      head: head,
      body: body,
      theme: "grid",
      styles: {
        fontSize: 8,
        halign: "center",
        valign: "middle",
        cellPadding: 2,
      },
      headStyles: {
        fillColor: [240, 240, 240],
        textColor: 0,
        fontSize: 9,
      },
      columnStyles: {
        0: { cellWidth: 8 },
        1: { cellWidth: 45 },
        2: { cellWidth: 15 },
        3: { cellWidth: 15 },
        4: { cellWidth: 15 },
        5: { cellWidth: 15 },
        6: { cellWidth: 15 },
        7: { cellWidth: 20 },
      },
      didParseCell(data) {
        if (data.column.index === 7) {
          const v = parseFloat(data.cell.raw);
          if (v < 50) data.cell.styles.textColor = [200, 0, 0];
          else if (v < 70) data.cell.styles.textColor = [200, 140, 0];
          else data.cell.styles.textColor = [0, 140, 70];
        }
      },
    });

    const pageH = doc.internal.pageSize.getHeight();
    doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text(
      "diunduh dari tjktsmkn1telukkuantan.web.id",
      pageWidth - 10,
      pageH - 8,
      { align: "right" },
    );

    doc.save("Rekap-Kehadiran-A4-Potrait.pdf");
  }

  // Update render tabel edit form data mentah untuk warna
  function renderEditTable() {
    const bulan = document.getElementById("editBulan").value;
    const tbody = document.getElementById("editTbody");
    tbody.innerHTML = "";

    const sumber =
      bulan === "ALL"
        ? window._rawRows.map((r, i) => ({ row: r, index: i }))
        : window._rawByMonth[bulan] || [];

    sumber.forEach(({ row, index }) => {
      let tr = "<tr>";
      row.forEach((cell, c) => {
        if (c >= 2) {
          const clsStatus = cell ? cell.toLowerCase() : "hadir";
          tr += `<td>
          <select class="input cellEdit select-presensi ${clsStatus}" data-r="${index}" data-c="${c}" onchange="updateSelectColor(this)">
            <option value="Hadir" class="opt-hadir" ${cell === "Hadir" ? "selected" : ""}>Hadir</option>
            <option value="Sakit" class="opt-sakit" ${cell === "Sakit" ? "selected" : ""}>Sakit</option>
            <option value="Izin" class="opt-izin" ${cell === "Izin" ? "selected" : ""}>Izin</option>
            <option value="Alfa" class="opt-alfa" ${cell === "Alfa" ? "selected" : ""}>Alfa</option>
            <option value="Cabut" class="opt-cabut" ${cell === "Cabut" ? "selected" : ""}>Cabut</option>
          </select>
        </td>`;
        } else {
          tr += `<td>${c === 0 ? formatTanggal(cell) : cell}</td>`;
        }
      });
      tr += "</tr>";
      tbody.insertAdjacentHTML("beforeend", tr);
    });
  }
</script>
